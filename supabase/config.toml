# Alpexa — Supabase CLI 설정 (2026-08-20)
# ============================================================================
# 왜 이 파일이 생겼나: Edge 함수를 GitHub Actions 로 자동 배포하기 시작했다
# (.github/workflows/deploy-edge.yml). CLI 배포는 **JWT 검증을 기본으로 켠다** —
# 그런데 우리 크론(supabase/sql/cron_secure.sql)은 대부분 Authorization 헤더 없이
# `net.http_get(url := '...?token=<CRON_SECRET>')` 로 호출한다. 검증이 켜지는 순간
# 우리 코드에 닿기도 전에 **401 로 전 피드가 죽는다.** 그래서 함수마다 명시적으로 고정한다.
#
# ⚠️ verify_jwt = false 가 "무방비"라는 뜻이 아니다. 관문은 함수 안의 CRON_SECRET
#    검사다: 시크릿 미설정 → 503, 토큰 불일치 → 401 (fail-closed). `tests/diagnose.js`
#    의 B8-failopen-cron 체크가 그 fail-closed 를 정적으로 강제한다.
#    즉 인증은 **없어진 게 아니라 JWT 대신 CRON_SECRET 으로** 걸려 있다.
#
# ⚠️ 여기 없는 함수는 이 리포에서 자동 배포하지 않는다 — 특히 돈을 옮기는
#    sports-settle · stake-accrue 와 모든 SQL 은 **사장님 수동 배포**로 남긴다
#    (CLAUDE.md #1 READ-BEFORE-WRITE 승인 원칙). 자동화가 그 규칙을 우회하면 안 된다.
# ============================================================================

project_id = "grxnbgtfnaayeluenvqh"

# ── 자동 배포 대상 (돈을 옮기지 않는 시세·목록 피드) ──────────────────────────
# 전부 크론이 헤더 없이 부른다 → verify_jwt 는 반드시 false.
[functions.sports-games]
verify_jwt = false

[functions.sports-odds]
verify_jwt = false

[functions.crypto-prices]
verify_jwt = false

[functions.fx-prices]
verify_jwt = false

[functions.stock-prices]
verify_jwt = false
