<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALPEXA — PAMM Desk</title>
<link rel="icon" href="favicon-32.png">
<!--
  PAMM 데스크 — v1 (2026-08-03 사장님 "레전드 기반으로 팜을 만들어 보자")
  · 펀드 운용 백오피스. 레전드2(RH 정통 다크) 룩 + 위젯 그리드 (sportsbook-desk 프레임 이식).
  · 돈 경로 = 서버 RPC만: pamm_desk_report(읽기) · pamm_create_fund/pamm_set_status(어드민 개입,
    confirmModal 관문). 참여/회수는 고객 앱 몫 — 이 데스크는 개설·감독·운용 현황.
  · 매니저(펀드 계좌 주인)와 어드민 둘 다 로그인 가능 — 서버가 권한별로 데이터를 줄인다.
  · 어드민 세션 = manager와 동일 체계(ALPEXA_ADMIN_SESSION → 격리 localStorage 키).
-->
<style>
:root,body.lgd{ --lgd-bg:#000000; --lgd-surface:#0E1015; --lgd-surface2:#161A22;
  --lgd-pill:#1D212A; --lgd-pill-hi:#252B36; --lgd-hair:#1D212A;
  --lgd-ink:#F5F7FA; --lgd-dim:#8B93A1; --lgd-green:#00C805; --lgd-up:#00C805;
  --lgd-down:#FF453A; --lgd-warn:#FFB020; --lgd-fs-body:12.5px; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--lgd-bg);color:var(--lgd-ink);font:400 13px/1.45 Inter,-apple-system,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
.hdr{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:var(--lgd-surface);border-bottom:1px solid var(--lgd-hair);position:relative;z-index:50}
.mark{width:24px;height:24px;border-radius:3px;background:var(--lgd-up);color:#04130a;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.hname{font-weight:800;letter-spacing:.3px}
.htag{font-size:10.5px;font-weight:800;color:var(--lgd-warn);border:1px solid var(--lgd-warn);border-radius:4px;padding:1px 6px;letter-spacing:.5px}
.hsp{flex:1}
.hsel{background:var(--lgd-pill);border:1px solid var(--lgd-hair);border-radius:6px;color:var(--lgd-ink);padding:4px 8px;font-size:12px;max-width:230px}
.hdot{width:8px;height:8px;border-radius:50%;background:#555}
.hdot.ok{background:var(--lgd-green)} .hdot.stale{background:var(--lgd-down)}
.hmail{font-size:11.5px;color:var(--lgd-dim);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{font-size:11.5px;font-weight:700;color:var(--lgd-dim);border:1px solid var(--lgd-hair);border-radius:6px;padding:4px 10px}
.hbtn:hover{color:var(--lgd-ink);border-color:var(--lgd-pill-hi)}
#board{position:relative;height:calc(100% - 40px);overflow:auto;padding:8px}
.wg{position:absolute;background:var(--lgd-surface);border:1px solid var(--lgd-hair);border-radius:10px;display:flex;flex-direction:column;min-width:180px;min-height:52px;overflow:hidden}
.wg-h{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--lgd-hair);cursor:grab;user-select:none;flex:0 0 auto}
.wg-h b{font-size:12px;font-weight:800}
.wg-h small{color:var(--lgd-dim);font-size:10.5px}
.wg-b{flex:1;overflow:auto;padding:9px 11px;font-size:var(--lgd-fs-body)}
.wg-rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;opacity:.45}
.wg-rs::after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--lgd-dim);border-bottom:2px solid var(--lgd-dim)}
.wg.drag{opacity:.85;z-index:40;cursor:grabbing}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--lgd-dim);font-weight:600;text-align:left;padding:3px 6px;border-bottom:1px solid var(--lgd-hair);white-space:nowrap;position:sticky;top:-9px;background:var(--lgd-surface)}
td{padding:4px 6px;border-bottom:1px solid rgba(29,33,42,.55);white-space:nowrap}
.r{text-align:right} th.r{text-align:right}
.up{color:var(--lgd-up)} .dn{color:var(--lgd-down)} .wr{color:var(--lgd-warn)}
.dim{color:var(--lgd-dim)}
.pill{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px}
.pill.red{background:rgba(255,69,58,.15);color:var(--lgd-down)}
.pill.grn{background:rgba(0,200,5,.13);color:var(--lgd-green)}
.pill.yel{background:rgba(255,176,32,.15);color:var(--lgd-warn)}
.empty{color:var(--lgd-dim);text-align:center;padding:18px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--lgd-surface2);border-radius:8px;padding:8px 10px}
.kpi .l{font-size:10.5px;color:var(--lgd-dim);font-weight:600}
.kpi .v{font-size:16.5px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.frm input{width:100%;background:var(--lgd-pill);border:1px solid var(--lgd-hair);border-radius:6px;color:var(--lgd-ink);padding:6px 9px;font-size:12px;margin-bottom:7px}
.frm input:focus{outline:none;border-color:var(--lgd-green)}
.frm .go{width:100%;background:var(--lgd-green);color:#04130a;font-weight:800;border-radius:6px;padding:8px;font-size:12.5px}
.abtn{font-size:10px;font-weight:800;border:1px solid var(--lgd-hair);border-radius:4px;padding:1px 6px;margin-left:4px;color:var(--lgd-dim)}
.abtn:hover{color:var(--lgd-ink);border-color:var(--lgd-pill-hi)}
.abtn.dn{color:var(--lgd-down);border-color:rgba(255,69,58,.4)}
.abtn.up{color:var(--lgd-green);border-color:rgba(0,200,5,.4)}
#opModal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:none;align-items:center;justify-content:center}
#opModal.on{display:flex}
.opbox{width:360px;background:var(--lgd-surface);border:1px solid var(--lgd-hair);border-radius:12px;padding:20px}
.opbox h3{font-size:14.5px;margin-bottom:8px}
.opbox .opb{font-size:12.5px;color:var(--lgd-dim);margin-bottom:16px;line-height:1.6}
.opbox .opr{display:flex;gap:8px;justify-content:flex-end}
.opbox button{font-weight:800;border-radius:7px;padding:8px 16px;font-size:12.5px}
.opbox .cancel{border:1px solid var(--lgd-hair);color:var(--lgd-dim)}
.opbox .go{background:var(--lgd-down);color:#fff}
.opbox .go.safe{background:var(--lgd-green);color:#04130a}
#gate{position:fixed;inset:0;background:var(--lgd-bg);z-index:100;display:flex;align-items:center;justify-content:center}
.gbox{width:330px;background:var(--lgd-surface);border:1px solid var(--lgd-hair);border-radius:12px;padding:26px}
.gbox h2{font-size:17px;margin-bottom:2px}
.gbox p{font-size:12px;color:var(--lgd-dim);margin-bottom:16px}
.gbox input{width:100%;background:var(--lgd-pill);border:1px solid var(--lgd-hair);border-radius:7px;color:var(--lgd-ink);padding:9px 11px;font-size:13px;margin-bottom:9px}
.gbox input:focus{outline:none;border-color:var(--lgd-green)}
.gbtn{width:100%;background:var(--lgd-green);color:#04130a;font-weight:800;border-radius:7px;padding:10px;font-size:13.5px}
.gbtn:disabled{opacity:.5}
.gerr{color:var(--lgd-down);font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>
<body class="lgd">

<div class="hdr">
  <div class="mark">A</div><span class="hname">PAMM Desk</span>
  <span class="htag">FUND OPS · v1</span>
  <select class="hsel" id="fundSel" title="Select fund"></select>
  <span class="hsp"></span>
  <span class="hdot" id="feedDot" title="data feed"></span>
  <span class="hmail" id="whoami"></span>
  <button class="hbtn" id="btnFundCtl" style="display:none" title="Pause / resume this fund">⚙</button>
  <button class="hbtn" id="btnNew" style="display:none;color:var(--lgd-green);border-color:rgba(0,200,5,.4)">+ New fund</button>
  <button class="hbtn" id="btnRefresh">↻ Refresh</button>
  <button class="hbtn" id="btnLayout">Reset layout</button>
  <button class="hbtn" id="btnOut" style="display:none">Sign out</button>
</div>
<div id="board"></div>

<div id="opModal"><div class="opbox">
  <h3 id="opTitle"></h3><div class="opb" id="opBody"></div>
  <div class="opr"><button class="cancel" id="opNo">Cancel</button><button class="go" id="opYes">Confirm</button></div>
</div></div>

<div id="nfModal" style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none;align-items:center;justify-content:center">
  <div class="opbox frm" style="width:430px">
    <h3 style="margin-bottom:10px">Create New Fund</h3>
    <input id="nfSearch" placeholder="Search name / email / account…">
    <div id="nfList" style="max-height:170px;overflow:auto;border:1px solid var(--lgd-hair);border-radius:6px;margin-bottom:7px"></div>
    <input id="nfName" placeholder="Fund name (e.g. Alpha FX Fund)">
    <div style="display:flex;gap:7px"><input id="nfFee" type="number" min="0" max="50" step="1" placeholder="Fee % (20)" style="flex:1"><input id="nfMin" type="number" min="0" step="10" placeholder="Min $ (100)" style="flex:1"></div>
    <div class="opr" style="margin-top:4px"><button class="cancel" id="nfClose">Cancel</button><button class="go safe" id="nfGo">Create Fund</button></div>
    <div class="dim" style="font-size:10.5px;margin-top:8px">Balance at creation = manager capital (NAV 1.0). Regular withdrawals lock while investors hold units.</div>
  </div>
</div>

<div id="gate">
  <div class="gbox">
    <h2>💼 PAMM Desk</h2>
    <p>Sign in as fund manager or admin</p>
    <input id="gEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="gPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="gbtn" id="gGo">Sign in</button>
    <div class="gerr" id="gErr"></div>
  </div>
</div>

<script>window.ALPEXA_ADMIN_SESSION = true;   // manager/sbdesk와 동일: 어드민 세션 격리 localStorage 키</script>
<script src="vendor/supabase.min.js?v=2"></script>
<script src="alpexa-sync.js"></script>
<script>
'use strict';
/* ════════ 유틸 ════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd2=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>{n=+n||0;return (n>=0?'+':'')+(n*100).toFixed(2)+'%';};
const ago=ts=>{const s=Math.max(0,(Date.now()-new Date(ts).getTime())/1000);
  if(s<90)return Math.round(s)+'s';if(s<5400)return Math.round(s/60)+'m';if(s<172800)return Math.round(s/3600)+'h';return Math.round(s/86400)+'d';};

/* ════════ 위젯 그리드 엔진 (sportsbook-desk 이식 — 12컬럼 · 드래그/리사이즈 · 레이아웃 저장) ════════ */
const COLS=12, RH=30, GAP=8, LKEY='alpexa.pammdesk.layout.v4';   // UI 설정 — 돈 아님, 로컬 OK
const WIDGETS=[
  {id:'kpi',    t:'', d:'', noHead:true,                          x:0,y:0, w:12,h:2},
  {id:'roster', t:'👥 Investors', d:'Shares · basis · P&L',        x:0,y:2, w:7, h:13},
  {id:'pos',    t:'📌 Open Positions', d:'Fund account · live',    x:7,y:2, w:5, h:13}];
let layout={}; try{ layout=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}; }catch(e){ layout={}; }
function colW(){ const b=$('board'); return Math.max(40,((b.clientWidth-16)-GAP*(COLS-1))/COLS); }
function place(el,g){ const cw=colW();
  el.style.left=(8+g.x*(cw+GAP))+'px'; el.style.top=(8+g.y*(RH+GAP/4))+'px';
  el.style.width=(g.w*cw+(g.w-1)*GAP)+'px'; el.style.height=(g.h*RH)+'px'; }
function geom(id){ const d=WIDGETS.find(w=>w.id===id); const s=layout[id]||{};
  return {x:s.x!=null?s.x:d.x, y:s.y!=null?s.y:d.y, w:s.w||d.w, h:s.h||d.h}; }
function saveGeom(id,g){ layout[id]=g; try{ localStorage.setItem(LKEY,JSON.stringify(layout)); }catch(e){} }
function buildBoard(){
  const b=$('board'); b.innerHTML='';
  WIDGETS.forEach(w=>{
    const el=document.createElement('div'); el.className='wg'; el.id='w-'+w.id;
    el.innerHTML=(w.noHead?'':'<div class="wg-h"><b>'+w.t+'</b><small>'+w.d+'</small></div>')
      +'<div class="wg-b" id="b-'+w.id+'"'+(w.noHead?' style="padding:0 14px;display:flex;align-items:center;overflow:hidden"':'')+'><div class="empty">…</div></div><div class="wg-rs"></div>';
    b.appendChild(el); place(el,geom(w.id));
    const h=el.querySelector('.wg-h')||el, rs=el.querySelector('.wg-rs');
    h.addEventListener('pointerdown',e=>{ if(e.target.closest('input,button,select,.wg-rs')) return; dragStart(e,el,w.id,false); });
    rs.addEventListener('pointerdown',e=>dragStart(e,el,w.id,true));
  });
}
function dragStart(e,el,id,resize){
  e.preventDefault(); const g=geom(id), cw=colW(), sx=e.clientX, sy=e.clientY;
  el.classList.add('drag'); el.setPointerCapture&&el.setPointerCapture(e.pointerId);
  const move=ev=>{ const dx=Math.round((ev.clientX-sx)/(cw+GAP)), dy=Math.round((ev.clientY-sy)/(RH+GAP/4));
    const ng=resize? {x:g.x,y:g.y,w:Math.min(COLS-g.x,Math.max(2,g.w+dx)),h:Math.max(3,g.h+dy)}
                   : {x:Math.max(0,Math.min(COLS-g.w,g.x+dx)),y:Math.max(0,g.y+dy),w:g.w,h:g.h};
    place(el,ng); el.__g=ng; };
  const upfn=()=>{ el.classList.remove('drag'); if(el.__g){ saveGeom(id,el.__g); el.__g=null; }
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',upfn); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',upfn);
}
window.addEventListener('resize',()=>{ WIDGETS.forEach(w=>{const el=$('w-'+w.id); if(el) place(el,geom(w.id));}); });

/* ════════ 데이터 — 단일 소스: pamm_desk_report RPC ════════ */
let FUNDS=[], CUR=null, POS=[], FXACCTS=[], pickAcct=null;
async function pullFxAccounts(){   // 개설 피커용 — 어드민 RLS 읽기 (실패=비어드민, 피커 대신 안내)
  try{
    const a=await AlpexaSync.db.from('accounts').select('acct_no,balance,player_id').eq('server','fx');
    const pl=await AlpexaSync.db.from('players').select('id,name,email');
    if(a&&Array.isArray(a.data)&&pl&&Array.isArray(pl.data)){
      const pm={}; pl.data.forEach(x=>pm[x.id]=x);
      FXACCTS=a.data.map(x=>({acct:x.acct_no,bal:+x.balance||0,name:(pm[x.player_id]||{}).name||'',email:(pm[x.player_id]||{}).email||''}))
        .filter(x=>!FUNDS.some(f=>f.fund_acct===x.acct))
        .sort((x,y)=>y.bal-x.bal);
    }
  }catch(e){ FXACCTS=[]; }
  const adm=FXACCTS.length>0;
  $('btnNew').style.display=adm?'':'none';
  $('btnFundCtl').style.display=(adm&&CUR)?'':'none';
}

function confirmModal(title, body, safe){
  return new Promise(res=>{
    $('opTitle').textContent=title; $('opBody').innerHTML=body;
    $('opYes').className='go'+(safe?' safe':''); $('opModal').classList.add('on');
    const done=v=>{ $('opModal').classList.remove('on'); $('opYes').onclick=$('opNo').onclick=null; res(v); };
    $('opYes').onclick=()=>done(true); $('opNo').onclick=()=>done(false);
  });
}
async function opRun(rpc,args){   // 개입 실행 공통 경로 — 성공 시 전체 리프레시
  try{
    const r=await AlpexaSync.db.rpc(rpc,args);
    const d=(r&&r.data)||{};
    if(!d.ok){ alert('Failed: '+(d.error||(r.error&&r.error.message)||'?')); return false; }
    pullReport(); return true;
  }catch(e){ alert('Failed: '+e.message); return false; }
}

async function pullReport(){
  if(!(window.AlpexaSync&&AlpexaSync.db)) return;
  try{
    const r=await AlpexaSync.db.rpc('pamm_desk_report',{});
    const d=(r&&r.data)||{};
    $('feedDot').className='hdot '+(d.ok?'ok':'stale');
    if(!d.ok) return;
    FUNDS=d.funds||[];
    const sel=$('fundSel'); const prev=CUR&&CUR.fund_acct;
    sel.innerHTML=FUNDS.map(f=>'<option value="'+esc(f.fund_acct)+'">'+esc(f.name)+' ('+esc(f.fund_acct)+')</option>').join('')||'<option>No funds</option>';
    CUR=FUNDS.find(f=>f.fund_acct===prev)||FUNDS[0]||null;
    if(CUR) sel.value=CUR.fund_acct;
    renderAll(); pullPositions(); pullFxAccounts();
  }catch(e){ $('feedDot').className='hdot stale'; }
}
async function pullPositions(){   // 펀드 계좌의 열린 포지션 (읽기 전용 — RLS: 매니저 본인/어드민)
  POS=[]; if(!CUR){ renderPos(); return; }
  try{
    const r=await AlpexaSync.db.from('positions').select('local_id,symbol,side,size,open_price,meta,created_at')
      .eq('acct_no',CUR.fund_acct).eq('server','fx').eq('status','open').limit(50);
    if(r&&Array.isArray(r.data)) POS=r.data;
  }catch(e){}
  renderPos();
}

/* ════════ 렌더 ════════ */
function renderAll(){ renderKpi(); renderRoster(); }
function renderKpi(){
  const b=$('b-kpi');
  if(!CUR){ b.innerHTML='<span class="dim" style="font-size:12.5px">No funds yet — create one in Fund Admin below</span>'; return; }
  const ret=(+CUR.nav||1)-1;
  b.innerHTML='<div style="display:flex;align-items:baseline;gap:16px;white-space:nowrap;overflow:auto;width:100%">'
    +'<b style="font-size:19px;font-variant-numeric:tabular-nums">'+usd2(CUR.equity)+'</b>'
    +'<span class="'+(ret>=0?'up':'dn')+'" style="font-weight:800;font-size:13.5px">'+pct(ret)+'</span>'
    +'<span class="dim" style="font-size:12px">NAV '+(+CUR.nav||1).toFixed(4)+'</span>'
    +'<span class="dim" style="font-size:12px">'+(+CUR.members||0)+' investor'+((+CUR.members||0)===1?'':'s')+'</span>'
    +'<span class="dim" style="font-size:12px">fee '+(+CUR.perf_fee_pct||0)+'%</span>'
    +'<span class="pill '+(CUR.status==='active'?'grn':CUR.status==='paused'?'yel':'red')+'">'+esc(CUR.status)+'</span>'
    +'</div>';
}
function renderRoster(){
  const b=$('b-roster'); if(!CUR){ b.innerHTML='<div class="empty">—</div>'; return; }
  const rs=CUR.roster;
  if(!rs){ b.innerHTML='<div class="empty">No access (manager/admin only)</div>'; return; }
  if(!rs.length){ b.innerHTML='<div class="empty">No investors yet</div>'; return; }
  b.innerHTML='<table><tr><th>Investor</th><th class="r">Basis</th><th class="r">Equity</th><th class="r">Share</th><th class="r">P&L</th><th class="r">Joined</th></tr>'
    +rs.map(m=>{
      const shr=(+CUR.total_units>0)?(+m.units/+CUR.total_units):0;
      const pnl=(+m.value||0)-(+m.basis||0);
      const isMgr=m.cust===CUR.manager_cust;
      return '<tr><td>'+esc(m.name||m.cust)+(isMgr?' <span class="pill yel">MGR</span>':'')+'</td>'
        +'<td class="r">'+usd2(m.basis)+'</td><td class="r">'+usd2(m.value)+'</td>'
        +'<td class="r">'+(shr*100).toFixed(1)+'%</td>'
        +'<td class="r '+(pnl>=0?'up':'dn')+'">'+(pnl>=0?'+':'−')+usd2(Math.abs(pnl))+'</td>'
        +'<td class="r dim">'+ago(m.joined)+'</td></tr>';
    }).join('')+'</table>';
}
function renderPos(){
  const b=$('b-pos'); if(!CUR){ b.innerHTML='<div class="empty">—</div>'; return; }
  if(!POS.length){ b.innerHTML='<div class="empty">No open positions<br><span style="font-size:11px">Joins/redemptions allowed (rollover rule)</span></div>'; return; }
  b.innerHTML='<div class="wr" style="font-size:11px;margin-bottom:6px">⚠️ Positions open — joins/redemptions after close</div>'
    +'<table><tr><th>Symbol</th><th>Side</th><th class="r">Lots</th><th class="r">Entry</th><th class="r">Age</th></tr>'
    +POS.map(p=>'<tr><td>'+esc(String(p.symbol).toUpperCase())+'</td><td class="'+(String(p.side).toLowerCase()==='buy'?'up':'dn')+'">'+esc(String(p.side).toUpperCase())+'</td>'
      +'<td class="r">'+(+p.size||0)+'</td><td class="r">'+(+p.open_price||0)+'</td><td class="r dim">'+ago(p.created_at)+'</td></tr>').join('')+'</table>';
}
function pickList(q){
  q=(q||'').toLowerCase();
  const rows=FXACCTS.filter(x=>!q||String(x.name).toLowerCase().includes(q)||String(x.email).toLowerCase().includes(q)||String(x.acct).toLowerCase().includes(q)).slice(0,30);
  if(!rows.length) return '<div class="empty" style="padding:10px 0">'+(FXACCTS.length?'No match':'No accounts (admin only)')+'</div>';
  return rows.map(x=>'<div class="pkrow" data-acct="'+esc(x.acct)+'" style="display:flex;gap:8px;align-items:center;padding:6px 9px;cursor:pointer;border-bottom:1px solid rgba(29,33,42,.55);'+(pickAcct&&pickAcct.acct===x.acct?'background:rgba(0,200,5,.10)':'')+'">'
    +'<div style="flex:1;min-width:0"><b style="font-size:12px">'+esc(x.name||'(no name)')+'</b> <span class="dim" style="font-size:10.5px">'+esc(x.email)+'</span></div>'
    +'<span class="dim" style="font-size:11px">'+esc(x.acct)+'</span><b style="font-size:11.5px">'+usd2(x.bal)+'</b></div>').join('');
}
function wireList(){
  document.querySelectorAll('#nfList .pkrow').forEach(el=>el.onclick=()=>{
    pickAcct=FXACCTS.find(x=>x.acct===el.dataset.acct)||null;
    const nm=$('nfName'); if(nm&&!nm.value&&pickAcct&&pickAcct.name) nm.value=pickAcct.name+' Fund';
    $('nfList').innerHTML=pickList($('nfSearch').value); wireList();
  });
}
function openNewFund(){
  pickAcct=null; $('nfName').value=''; $('nfSearch').value='';
  $('nfList').innerHTML=pickList(); wireList();
  $('nfModal').style.display='flex';
}
function wireNewFund(){
  $('btnNew').onclick=openNewFund;
  $('nfClose').onclick=()=>{ $('nfModal').style.display='none'; };
  $('nfSearch').oninput=()=>{ $('nfList').innerHTML=pickList($('nfSearch').value); wireList(); };
  $('nfGo').onclick=async()=>{
    if(!pickAcct){ alert('Pick a customer account from the list first'); return; }
    const name=($('nfName').value||'').trim()||((pickAcct.name||'Fund')+' Fund');
    const fee=+($('nfFee').value||20), min=+($('nfMin').value||100);
    $('nfModal').style.display='none';
    if(await confirmModal('Create Fund','<b>'+esc(pickAcct.name||pickAcct.acct)+'</b> ('+esc(pickAcct.acct)+' · '+usd2(pickAcct.bal)+')<br>→ fund <b>'+esc(name)+'</b> · fee '+fee+'% · min '+usd2(min)+'<br>Regular withdrawals from this account lock while investors hold units.',true))
      opRun('pamm_create_fund',{p_ref:'pamm-create-'+pickAcct.acct+'-'+Date.now(),p_acct:pickAcct.acct,p_name:name,p_fee_pct:fee,p_min:min});
  };
  $('btnFundCtl').onclick=async()=>{
    if(!CUR) return;
    const toPause=CUR.status==='active';
    if(await confirmModal(toPause?'Pause Fund':'Resume Fund',
        '<b>'+esc(CUR.name)+'</b> ('+esc(CUR.fund_acct)+')<br>'+(toPause?'New joins will be blocked (existing shares & trading unaffected).':'New joins will be allowed again.'),!toPause))
      opRun('pamm_set_status',{p_fund:CUR.fund_acct,p_status:toPause?'paused':'active'});
  };
}

/* ════════ 로그인 게이트 (sbdesk 동일) ════════ */
async function boot(){
  buildBoard();
  $('fundSel').onchange=()=>{ CUR=FUNDS.find(f=>f.fund_acct===$('fundSel').value)||null; renderAll(); pullPositions(); };
  $('btnRefresh').onclick=pullReport; wireNewFund();
  $('btnLayout').onclick=()=>{ layout={}; try{localStorage.removeItem(LKEY);}catch(e){} buildBoard(); renderAll(); renderPos(); };
  $('btnOut').onclick=async()=>{ try{ await AlpexaSync.db.auth.signOut(); }catch(e){} location.reload(); };
  try{
    const s=await AlpexaSync.db.auth.getSession();
    const em=s&&s.data&&s.data.session&&s.data.session.user&&s.data.session.user.email;
    if(em){ enter(em); return; }
  }catch(e){}
  $('gGo').onclick=async()=>{
    $('gGo').disabled=true; $('gErr').textContent='';
    try{
      const r=await AlpexaSync.db.auth.signInWithPassword({email:$('gEmail').value.trim(),password:$('gPass').value});
      if(r&&r.error){ $('gErr').textContent=r.error.message; $('gGo').disabled=false; return; }
      enter($('gEmail').value.trim());
    }catch(e){ $('gErr').textContent=String(e.message||e); $('gGo').disabled=false; }
  };
}
function enter(email){
  $('gate').style.display='none'; $('btnOut').style.display='';
  $('whoami').textContent=email;
  pullReport(); setInterval(pullReport,30000);
}
document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
