<script>
/* One-time local history reset: open trading.html?clearhist=1 to wipe stale local
   funding/transaction caches left over from testing (balance is untouched). */
(function(){try{ if(/[?&]clearhist=1/.test(location.search)){ ['alpexa.funding','alpexa.txns','alpexa.transactions','alpexa.withdrawals'].forEach(function(k){ localStorage.removeItem(k); }); location.replace(location.pathname); } }catch(e){}})();
/* Restore identity from the URL (#alpexa=...) so a home-screen install can inherit the account created in Safari (iOS isolates their storage) - no re-login. */
(function(){try{var m=(location.hash||"").match(/alpexa=([^&]+)/);if(m){var id=JSON.parse(decodeURIComponent(atob(m[1])));if(id&&id.accts){localStorage.setItem("alpexa.me",JSON.stringify(id));}}}catch(e){}})();
/* #5: money/balance/holdings/positions are NEVER truth in localStorage — they live on
   the server (accounts.balance / positions) and in memory only. So there is no money
   cache to "guard": PURGE any legacy money-truth keys on every load (no cacheOwner
   owner-tracking — that pattern kept money local and leaked it across accounts).
   alpexa.funding/transactions/txns are DISPLAY history (not money truth) and stay. */
(function(){try{["alpexa.serverBalances","alpexa.balances","alpexa.cryptoHoldings","alpexa.staked","alpexa.sportsBalance","alpexa.cryptoBalance","alpexa.fxLive","alpexa.openBets","alpexa.settledBets","alpexa.positions","alpexa.cacheOwner","alpexa.ownerFunded"].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});}catch(e){}})();
/* Login gate (real service): no anonymous guest trading. Require a logged-in identity (email or authId); guests/empty go to login. */
(function(){try{var m=JSON.parse(localStorage.getItem("alpexa.me")||"null");if(!(m&&m.accts&&(m.email||m.authId))){location.replace("login.html");}}catch(e){location.replace("login.html");}})();
</script>
<script src="alpexa-sync.js?v=16"></script>
<script>
/* Session guard (same as the crypto app). alpexa.me is only a local name tag;
   reading your own positions/balance needs a real Supabase auth SESSION — without
   it, RLS hides every row and the account looks empty. If Supabase is reachable and
   there's no session, send the user to log in. Per-tab flag prevents loops; silent
   if Supabase is simply unreachable (offline). */
(function(){
  try {
    if (!window.AlpexaSync || !AlpexaSync.db || !AlpexaSync.db.auth) return;
    var m = JSON.parse(localStorage.getItem("alpexa.me")||"null");
    if (!(m && m.accts)) return;
    if (sessionStorage.getItem("alpexa.sessChecked")) return;
    AlpexaSync.db.auth.getSession().then(function(r){
      if (!(r && r.data && r.data.session)) {
        sessionStorage.setItem("alpexa.sessChecked","1");
        location.replace("login.html?expired=1");
      }
    }).catch(function(){});
    // Identity guard: if the auth session doesn't OWN this displayed account, re-login.
    AlpexaSync.assertIdentity();
  } catch(e) {}
})();
</script>

<script>
// ALPEXA SFX
(function(){
  let ctx=null;
  function audio(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ctx.state==='suspended')ctx.resume();return ctx;}
  function tone({freq=800,dur=0.15,type='sine',vol=0.18,attack=0.005,decay=0.1,slideTo=null,when=0}){const ac=audio();if(!ac)return;const t=ac.currentTime+when;const osc=ac.createOscillator();const gain=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);if(slideTo!=null)osc.frequency.exponentialRampToValueAtTime(slideTo,t+dur);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(vol,t+attack);gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.connect(gain).connect(ac.destination);osc.start(t);osc.stop(t+dur+0.02);}
  function chord(notes,opts={}){notes.forEach((n,i)=>tone({...opts,freq:n,when:(opts.when||0)+i*0.02}));}
  function getMuted(){try{const raw=localStorage.getItem('alpexa.prefs');if(raw)return JSON.parse(raw).soundMuted===true;}catch(e){}return false;}
  const sfx={
    orderFill(side){if(!getMuted()){if(side==='BUY'){tone({freq:660,dur:0.12,type:'sine',vol:0.18,slideTo:1320,decay:0.12});tone({freq:880,dur:0.18,type:'sine',vol:0.12,when:0.06});}else{tone({freq:880,dur:0.12,type:'sine',vol:0.18,slideTo:440,decay:0.12});tone({freq:660,dur:0.18,type:'sine',vol:0.12,when:0.06});}}},
    pendingPlaced(){if(!getMuted())tone({freq:740,dur:0.22,type:'triangle',vol:0.14});},
    triggered(){if(!getMuted())chord([880,1320],{dur:0.16,type:'sine',vol:0.14});},
    closed(){if(!getMuted())tone({freq:520,dur:0.18,type:'sine',vol:0.14,slideTo:380});},
    error(){if(!getMuted()){tone({freq:200,dur:0.12,type:'square',vol:0.12});tone({freq:160,dur:0.18,type:'square',vol:0.12,when:0.08});}},
    tick(){if(!getMuted())tone({freq:1200,dur:0.04,type:'sine',vol:0.06});},
  };
  window.ALPEXA_SFX=sfx;
  // iOS unlocks Web Audio only inside a user gesture — prime it on first touch
  // so the very first order-fill sound plays reliably.
  function unlock(){
    var ac=audio(); if(ac){
      try{ var buf=ac.createBuffer(1,1,22050); var src=ac.createBufferSource(); src.buffer=buf; src.connect(ac.destination); src.start(0); }catch(e){}
      try{ if(ac.state==='suspended') ac.resume(); }catch(e){}
    }
    document.removeEventListener('touchend',unlock,true); document.removeEventListener('mousedown',unlock,true); document.removeEventListener('click',unlock,true);
  }
  document.addEventListener('touchend',unlock,true);
  document.addEventListener('mousedown',unlock,true);
  document.addEventListener('click',unlock,true);
})();
</script>

  function refreshMe(){ try{
    if(!window.AlpexaSync||!AlpexaSync.db)return;
    var m; try{m=JSON.parse(localStorage.getItem('alpexa.me')||'null');}catch(e){return;}
    if(!m||(!m.authId&&!m.email))return;
    var q=AlpexaSync.db.from('players').select('id,cust_id,name,email,auth_id');
    if(m.authId) q=q.eq('auth_id',m.authId); else q=q.ilike('email',m.email);
    q.order('created_at',{ascending:true}).limit(1).then(function(r){
      var p=r&&r.data&&r.data[0]; if(!p)return;
      AlpexaSync.db.from('accounts').select('server,acct_no').eq('player_id',p.id).then(function(r2){
        var accts={}; (r2&&r2.data||[]).forEach(function(a){ accts[a.server]=a.acct_no; });
        if(!accts.fx&&!accts.crypto&&!accts.sports)return; // never wipe identity if accounts are missing
        var merged=Object.assign({},m,{custId:p.cust_id,name:p.name||m.name,email:p.email||m.email,authId:p.auth_id||m.authId,accts:accts});
        localStorage.setItem('alpexa.me',JSON.stringify(merged));
      },function(){});
    },function(){});
  }catch(e){} }
  setTimeout(refreshMe,800);
  /* (__alpexaSettle 제거 — 2026-07-23 "1번 고". 클라가 자기 계산 P&L로 settlements를 직접
     insert하던 경로 — FX 정산은 fx_close/fx_sltp/fx_stopout 서버 3형제만 쓴다. 돈은 서버만 #5.) */
  function push(){
    if(!window.AlpexaSync||!AlpexaSync.db)return;
    var m=meX(); if(!m||!m.accts.fx)return; var cust=m.custId, acct=m.accts.fx;
    AlpexaSync.db.from('players').update({last_seen:new Date().toISOString(),last_app:'fx'}).eq('cust_id',cust).then(function(){},function(){});
    var live=[]; try{ live=window.__fxLive||[]; }catch(e){}
    // Positions are CREATED by fx_open and CLOSED by fx_close/fx_sltp/fx_stopout (전부 서버).
    // 여기선 백오피스 화면용 pnl "숫자"만 신선하게 UPDATE한다 — status='open' 조건 필수.
    // ⚠️ 옛 upsert(status:'open' 통째 재기록)는 서버가 방금 청산한 행을 경합 창(≤4s)에서
    // 도로 open으로 되살릴 수 있었다 → 재청산 시 이중 정산 위험 (2026-07-23 "1번 고" 폐쇄).
    // UPDATE+eq(status,'open')은 닫힌 행을 절대 못 건드린다 — 부활 불가능이 구조가 됐다.
    live.forEach(function(o){ if(!o||!(+o.vol>0))return;
      var lid=String(o.id||''); if(!lid) return;
      AlpexaSync.db.from('positions').update({pnl:Math.round((+o.pnl||0)*100)/100})
        .eq('acct_no',acct).eq('server','fx').eq('local_id',lid).eq('status','open').then(function(){},function(){});
    });
  }
  /* (__fxSyncDelete 제거 — 호출처 0(broadcastPositionClose는 no-op). 클라 positions delete 경로 폐쇄.) */
  setTimeout(push,2000); setInterval(function(){ if(!document.hidden){ push(); } else { window.__bgPosPush=window.__bgPosPush||0; if(Date.now()-window.__bgPosPush>9000){ window.__bgPosPush=Date.now(); push(); } } },3000);
  // Instant: when a position opens/closes (id list changes), push right away
  // instead of waiting for the next tick. PnL drift rides the 3s interval.
  function posSig(){try{var a=window.__fxLive||[];return a.map(function(o){return o&&o.id;}).join(',');}catch(e){return'';}}
  var _psig=posSig();
  setInterval(function(){var n=posSig(); if(n!==_psig){_psig=n; if(!document.hidden)push();}},700);
  // Lightweight presence heartbeat — runs even in the background so the back
  // office "Online" view stays accurate; fires immediately on focus too.
  function beat(){ if(!window.AlpexaSync||!AlpexaSync.db)return; var m=meX(); if(!m)return;
    var patch={last_seen:new Date().toISOString(),last_app:'fx'};
    // Match by email (stable) when we have it, else cust_id — survives cust_id drift.
    if(m.email) AlpexaSync.db.from('players').update(patch).ilike('email',m.email).then(function(){},function(){});
    else if(m.custId) AlpexaSync.db.from('players').update(patch).eq('cust_id',m.custId).then(function(){},function(){}); }
  setTimeout(beat,1500); setInterval(beat,8000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) beat(); });
  // Dealing desk: pull the back-office spread/bias settings and expose them to the
  // price engine. Hard-limited client-side too, so a bad value can't break pricing.
  window.__alpexaFXPricing=window.__alpexaFXPricing||{spreadMult:1,biasFrac:0};
  window.__alpexaFXMarks=window.__alpexaFXMarks||{};
  function pullPricing(){ if(!window.AlpexaSync||!AlpexaSync.db)return;
    AlpexaSync.db.from('pricing').select('*').eq('server','fx').limit(1).then(function(r){
      var p=r&&r.data&&r.data[0]; if(!p)return;
      var sm=+p.spread_mult; if(!(sm>0))sm=1; sm=Math.max(1,Math.min(5,sm)); // floor 1x: never tighter than the realistic base spread (anti-arb moat)
      var bb=+p.bias_bps; if(!isFinite(bb))bb=0; bb=Math.max(-30,Math.min(30,bb));
      window.__alpexaFXPricing={spreadMult:sm,biasFrac:bb/10000};
    },function(){});
    // Per-symbol spread markup (points), set in the back-office dealing desk.
    AlpexaSync.db.from('pricing_marks').select('symbol,markup_pts').then(function(r){
      if(r&&r.data){ var m={}; r.data.forEach(function(p){ var v=+p.markup_pts||0; m[p.symbol]=Math.max(0,Math.min(50,v)); }); window.__alpexaFXMarks=m; }
    },function(){}); }
  setTimeout(pullPricing,1200); setInterval(function(){ if(!document.hidden) pullPricing(); },5000);
  // Shared price feed (one source for everyone). The engine anchors to this each
  // pull so all clients + the back office show the same quote. If the feed goes
  // stale (no manager publishing), the app falls back to its own simulation.
  window.__alpexaFXFeed=window.__alpexaFXFeed||{};
  function fxApplyFeed(rows){ var now=Date.now(),f={}; rows.forEach(function(p){ f[p.symbol]={mid:+p.mid||0,spr:+p.spr_pts||0,ts:now}; }); window.__alpexaFXFeed=f; }
  // ⚡ Overload guard: read FX prices through the 1s-cache `feed` Edge (all users → ~1 DB
  // read/sec). Backward-compatible — feed error/undeployed → direct prices query fallback.
  async function pullFeed(){ if(!window.AlpexaSync||!AlpexaSync.db) return;
    try{ if(AlpexaSync.db.functions){ var x=await AlpexaSync.db.functions.invoke('feed',{body:{t:'prices'}}); if(x&&!x.error&&Array.isArray(x.data)){ fxApplyFeed(x.data); return; } } }catch(e){}
    AlpexaSync.db.from('prices').select('symbol,mid,spr_pts').then(function(r){ if(r&&r.data) fxApplyFeed(r.data); },function(){}); }
  setTimeout(pullFeed,1000); setInterval(function(){ if(!document.hidden) pullFeed(); },1500);
  // Realtime push (webtrade pattern, 2026-07-13): a prices UPDATE merges straight into
  // __alpexaFXFeed — the exact shape fxApplyFeed writes — and the 1s anchor loop snaps the
  // engine to it, so quotes match webtrade instead of lagging up to ~3s behind it. Single-row
  // MERGE (never wipe other symbols); junk events ignored; the 1.5s poll above stays as the
  // fallback, and the same rows are idempotent across both paths.
  try{ if(window.AlpexaSync&&AlpexaSync.db&&AlpexaSync.db.channel){
    AlpexaSync.db.channel('prices-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'prices'},function(m){
        var row=m&&m.new; if(!row||!row.symbol) return;
        var f=window.__alpexaFXFeed||{};
        f[row.symbol]={mid:+row.mid||0,spr:+row.spr_pts||0,ts:Date.now()};
        window.__alpexaFXFeed=f;
      })
      .subscribe();
  } }catch(e){}
  // Kill switch: read the back-office trading-halt flag.
  window.__alpexaHalt=false;
  function pullHalt(){ if(!window.AlpexaSync||!AlpexaSync.db)return;
    AlpexaSync.db.from('controls').select('val').eq('key','trading_halt').limit(1).then(function(r){
      window.__alpexaHalt=!!(r&&r.data&&r.data[0]&&r.data[0].val==='1'); },function(){}); }
  setTimeout(pullHalt,1500); setInterval(function(){ if(!document.hidden) pullHalt(); },5000);
  /* Execute back-office commands (force close). */
  function runCmds(){
    if(!window.AlpexaSync||!AlpexaSync.db)return; var m=meX(); if(!m||!m.accts.fx)return; var cust=m.custId;
    AlpexaSync.db.from('commands').select('*').eq('cust_id',cust).eq('server','fx').eq('status','pending').then(function(r){
      if(!r||!r.data||!r.data.length)return;
      r.data.forEach(function(c){ try{
        if(c.action==='set_balance'){ var t=parseFloat(c.local_id);
          if(!isNaN(t)&&window.getBalances&&window.addBalance){ var b=window.getBalances(); window.addBalance('live', t-(+b.live||0)); } }
        else if(window.__alpexaFXClose) window.__alpexaFXClose(c.local_id); }catch(e){}
        AlpexaSync.db.from('commands').update({status:'done'}).eq('id',c.id).then(function(){},function(){}); });
      setTimeout(push,1000);
    },function(){});
  }
  setTimeout(runCmds,4000); setInterval(function(){if(!document.hidden)runCmds();},4000);
})();
</script>
