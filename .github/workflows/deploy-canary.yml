name: deploy path canary

# Alpexa — **배포 경로가 살아 있나** 주 1회 확인 (2026-08-31 사장님 지시 ①)
# ============================================================================
# 왜 생겼나 — 2026-08-28~31 실사고. ESPN 약어 매칭 수정이 verify 초록·시뮬 검증까지
#   끝나 있었는데 **배포가 3일 막혔다.** `SUPABASE_ACCESS_TOKEN` 이 어느 시점부터
#   401(Unauthorized) 이었는데, deploy-edge.yml 은 `supabase/functions/**` 를 푸시할
#   때만 도니까 **아무도 몰랐다.** 고칠 코드는 있고 고칠 길이 죽어 있던 상태다.
#   그 사이 간판 축구(맨시티·토트넘·맨유)를 계속 못 팔았다.
#
#   감시가 아무리 두꺼워도 **고칠 통로가 막혀 있으면 소용이 없다.** 그래서 통로 자체를
#   감시 대상에 넣는다. 문제가 터진 날이 아니라 **평상시에** 알아야 한다.
#
# 무엇을 하나 (읽기 전용 — 아무것도 배포하지 않는다):
#   ① 시크릿이 설정돼 있나
#   ② 그 토큰으로 Supabase 가 실제로 응답하나  (`functions list`)
#      ↳ 우리가 실제로 맞은 실패가 정확히 이 호출의 401 이었다. 같은 신호를 본다.
#   ③ config.toml 이 허용목록 함수의 verify_jwt=false 고정을 유지하나
#      ↳ 이게 빠지면 CLI 기본값(검증 ON)으로 배포돼 **크론이 전부 401** = 전 피드 사망.
#
# 🚫 일부러 **배포는 하지 않는다.** 멀쩡한 함수를 주마다 다시 밀면 "손 안 댄 함수가
#    배포로 흔들리면 안 된다"(deploy-edge.yml 규율)를 스스로 어기게 된다. 우리가 맞은
#    고장은 인증 단계였고, 인증은 읽기 호출로 똑같이 검증된다.
#
# 알림 = 침묵 게이트. 🟢면 조용, 🔴면 워크플로 빨강 → GitHub 이 오너에게 이메일
#   (hourly-selfcheck·daily-sports-check 와 같은 방식).
#
# ⚠️ 스케줄은 **main 브랜치**에 있어야 활성화된다 (hourly-selfcheck·feed-liveness 와 동일).
# ============================================================================

on:
  schedule:
    - cron: '40 16 * * 1'   # 매주 월요일 16:40 UTC (베가스 9:40 AM) — 아침 점검 뒤
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: grxnbgtfnaayeluenvqh
      AUTO: "sports-games sports-odds crypto-prices fx-prices stock-prices"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wizardly-ritchie-lsRnz   # 서빙 브랜치에 config.toml 이 있다

      # ① 시크릿 존재 — 없으면 자동배포가 조용히 꺼져 있는 상태다.
      #    deploy-edge.yml 은 미설정 시 "조용히 건너뛰기"가 맞다(매 푸시마다 빨간 메일은 해롭다).
      #    하지만 **이 워크플로의 존재 이유가 "지금 배포가 되나?"** 이므로 여기선 빨강이다.
      - name: ① 토큰 시크릿이 설정돼 있나
        env: { TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 미설정 — Edge 자동배포가 꺼져 있습니다."
            echo "  Supabase → Account → Access Tokens 에서 발급 후"
            echo "  GitHub → Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi
          echo "시크릿 존재 ✔"

      - uses: supabase/setup-cli@v1
        with: { version: latest }

      # ② 토큰이 실제로 통하나 — 배포 없이 인증만 확인.
      #    2026-08-28 실패 로그: `unexpected list functions status 401: {"message":"Unauthorized"}`
      - name: ② 토큰으로 Supabase 가 응답하나 (배포 안 함)
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          set -o pipefail
          if ! supabase functions list --project-ref "$PROJECT_REF" > /tmp/fns.txt 2>&1; then
            echo "::error::배포 경로 사망 — 토큰이 거부됐습니다. 지금 고칠 것이 생겨도 배포하지 못합니다."
            sed -n '1,20p' /tmp/fns.txt
            echo "  → 토큰 재발급 후 GitHub 시크릿 SUPABASE_ACCESS_TOKEN 을 Update 하세요."
            exit 1
          fi
          echo "인증 OK ✔  — 배포 경로 살아 있음"
          sed -n '1,40p' /tmp/fns.txt

      # ③ verify_jwt 고정 — 빠지면 배포 즉시 크론이 401 로 전 피드를 죽인다.
      - name: ③ config.toml 이 verify_jwt=false 를 유지하나
        run: |
          miss=""
          for f in $AUTO; do
            grep -A3 -E "^\[functions\.$f\]" supabase/config.toml | grep -q "verify_jwt *= *false" || miss="$miss $f"
          done
          if [ -n "$miss" ]; then
            echo "::error::config.toml 에 verify_jwt=false 고정 누락:$miss"
            echo "  크론은 Authorization 헤더 없이 부릅니다 — 검증이 켜지면 배포 즉시 전 피드가 401."
            exit 1
          fi
          echo "verify_jwt 고정 확인 ✔ (허용목록 5종)"

      - name: 요약
        run: echo "🟢 배포 경로 정상 — 토큰 유효 · verify_jwt 고정 유지 · 배포 0건(읽기 전용 확인)"
