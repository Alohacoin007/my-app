/* 가입(Open Account) 화면 (2026-11-27 사장님 시안 승인 "오픈어카운트 진행해").
   디자인 = 로그인과 같은 문법(모바일 FX 앱 다크): 순검정 · 주황 한 색 · 가는 숫자 · 가는 선 · 알약.
   ⚠️ 단계 화면의 마크업은 가입 스크립트 안 템플릿이 만든다 — **스크립트는 0 변경**이라 모양은 여기 CSS 로만 입힌다.
      템플릿의 인라인 스타일(옛 파랑 · 회색)은 속성 선택자 + !important 로 덮는다. 계약: tests/signup-page.test.js */
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#000;--surface:#1C1C1E;--line:#38383A;--text:#fff;--dim:#98989F;--mute:#8E8E93;--acc:#FF9F0A;--on-acc:#000;--down:#FF3B30;--gut:clamp(20px,4.4vw,64px);color-scheme:dark}
html,body{background:var(--bg)}
body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;color:var(--text);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.mono{font-family:inherit;font-variant-numeric:tabular-nums}
/* 아이콘 글꼴을 쓰지 않는다 — 글자 이름(arrow_back 등)이 보이지 않게 크기 0, 필요한 곳만 기호로 */
.msi{font-size:0!important;line-height:1;display:inline-block}
.hdr-back .msi::before{content:"\2190";font-size:20px}
.field-inner[onclick] .msi::before{content:"\203A";font-size:20px;color:var(--acc)}
.csheet-x .msi::before{content:"\00D7";font-size:20px}
/* 바깥 틀 */
.lg-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:calc(env(safe-area-inset-top,0px) + 22px) var(--gut) 22px}
.wordmark{font-size:20px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.wordmark .b-fx{display:none}html.from-fx .wordmark .b-fx{display:inline}html.from-fx .wordmark .b-co{display:none}
.lg-open{height:40px;padding:0 18px;border-radius:20px;background:var(--surface);display:inline-flex;align-items:center;font-size:15px;font-weight:600;white-space:nowrap}
.lg-main{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:clamp(40px,7vw,120px);padding:20px var(--gut) 60px;max-width:1320px;width:100%;margin:0 auto}
.lg-main>*{min-width:0}
.face .lbl{font-size:15px;color:var(--dim)}
.face .num{margin-top:6px;font-weight:200;font-size:clamp(84px,11.5vw,176px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.face .num small{font-size:.32em;font-weight:200;color:var(--mute);letter-spacing:-.01em;margin-left:.12em}
.face ol{list-style:none;margin-top:34px;border-top:1px solid var(--line)}
.face li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--mute)}
.face li.on{color:var(--text)}.face li.done{color:var(--dim)}.face li i{font-style:normal}.face li.on i{color:var(--acc)}
.lg-foot{padding:18px var(--gut) calc(env(safe-area-inset-bottom,0px) + 24px);font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
#wrap{width:100%;max-width:440px;justify-self:end;display:flex;flex-direction:column;position:relative}
/* 단계 머리 · 진행 표시 */
.hdr{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.hdr-back{width:36px;height:36px;margin-left:-8px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--text);border-radius:18px}
.hdr-ttl{font-size:13px;color:var(--dim)}
.progress{display:flex;gap:5px;margin-bottom:26px}
.pstep{flex:1;height:2px;background:var(--line)}
.pstep.done,.pstep.active{background:var(--acc)}
.pdot,.plabel,.pbar{display:none}
/* 본문 */
.body{flex:1}
.body-title{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.body-sub{margin-top:8px;font-size:15px;line-height:1.45;color:var(--dim)!important}
.body-sub b{color:var(--text);font-weight:500}
.section-label{margin:26px 0 10px;font-size:13px;color:var(--dim)}
.section-label + .body-sub{margin:0 0 10px!important;font-size:13.5px}
/* 1단계: 카드 → 알약. 고른 것의 설명 한 줄만 알약 줄 아래에 보인다 */
.opt-grid,.opt-row{display:flex;flex-wrap:wrap;gap:8px;position:relative;padding-bottom:30px}
.opt-card{height:40px;padding:0 18px;border-radius:20px;background:var(--surface);display:inline-flex;align-items:center;cursor:pointer;min-width:0!important;flex:0 0 auto!important;transition:background .15s,color .15s}
.opt-card.sel{background:var(--acc);color:var(--on-acc)}
.opt-ico,.opt-tag,.opt-check{display:none}
.opt-name{font-size:16px;font-weight:500;white-space:nowrap}.opt-card.sel .opt-name{font-weight:600}
.opt-desc{display:none}
.opt-card.sel .opt-desc{display:block;position:absolute;left:0;bottom:4px;font-size:13.5px;color:var(--dim);white-space:nowrap}
.body button[style*="border-radius:8px"]{height:40px;padding:0 18px!important;border-radius:20px!important;background:var(--surface)!important;color:var(--text)!important;font-family:inherit!important;font-size:16px!important;font-weight:500!important;letter-spacing:0!important}
.body button[style*="#2F6BF6"]{background:var(--acc)!important;color:var(--on-acc)!important;font-weight:600!important}
.body div[style*="gap:6px"]{gap:8px!important}
/* 입력 줄 — 왼쪽 이름표 + 가는 선 */
.field-row{display:block}
.field{display:flex;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.body-sub + .field-row,.body-sub + .field{margin-top:22px}
.body-sub + .field-row{border-top:1px solid var(--line)}.body-sub + .field{border-top:1px solid var(--line)}
.field-label{width:132px;flex:none;font-size:15px;line-height:1.25;color:var(--dim)}
.field-inner .msi,.suc-wrap .msi,.primary-btn .msi,.csheet-search .msi{display:none}
.field-inner[onclick] .msi{display:inline-block}
.field-label span{display:none}
.field-inner{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 0}
.field-inner input,.field-inner select{flex:1;min-width:0;text-overflow:ellipsis;border:none;outline:none;background:transparent;font-family:inherit;font-size:17px;color:var(--text)}
.field-inner input::placeholder,.dob3 .dobcell::placeholder{color:#5A5A5E}
.field-inner span[style*="inline-flex"]{background:var(--surface)!important;color:var(--text)!important;font-family:inherit!important}
.dob3{flex:1;display:flex;align-items:center;gap:6px;padding:11px 0}
.dob3 .dobcell{width:3.4em;border:none;outline:none;background:transparent;font-family:inherit;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.dob3 .dobcell:first-of-type{width:4.2em}.dob3 .dobsep{color:var(--mute)}
.eye::after{content:"Show";font-size:15px;color:var(--acc)}
#pwInput[type="text"] ~ .eye::after{content:"Hide"}
.strength{flex-basis:100%;display:flex;gap:5px;margin:2px 0 6px}
.s-bar{flex:1;height:2px;background:var(--line)}.s-bar.f1{background:var(--down)}.s-bar.f2{background:var(--acc)}.s-bar.f3{background:#FFD60A}.s-bar.f4{background:#30D158}
.strength-txt{flex-basis:100%;font-size:13px;color:var(--dim);padding-bottom:8px;min-height:24px}
/* 인증 코드 · PIN — 밑줄 칸 + 가는 숫자 */
.otp-wrap{display:flex;gap:12px;margin:26px 0 0;flex-basis:100%}
.field .otp-wrap{margin:4px 0 6px!important}
.otp-cell.pin-cell{height:50px!important;font-size:34px!important}
.otp-cell{flex:1;min-width:0;max-width:58px;width:auto!important;height:66px!important;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:center;font-family:inherit;font-weight:200;font-size:44px!important;color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.otp-cell:focus,.otp-cell.filled{border-bottom-color:var(--acc)}
.field .otp-wrap + div{flex-basis:100%;text-align:left!important;font-size:13px!important;color:var(--dim)!important;padding-bottom:8px}
.otp-help{margin-top:22px;font-size:15px;color:var(--dim)}
.otp-help span{color:var(--text)!important;font-weight:400!important}
.otp-resend{margin-top:8px;background:none;border:none;font-family:inherit;font-size:15px;color:var(--acc);cursor:pointer;padding:0}
.otp-resend:disabled{color:#5A5A5E;cursor:default}
#otpError{text-align:left!important;font-size:14px!important;color:#FF6961!important}
.body > div[style*="text-align:center"]{text-align:left!important;font-size:13.5px!important;color:var(--dim)!important}
/* 약관 */
.term-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.body div[style*="margin-top:12px"]{margin-top:22px!important;border-top:1px solid var(--line)}
.term-cb{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);margin-top:1px}
.term-cb.on{background:var(--acc);border-color:var(--acc)}
.term-text{font-size:14.5px;line-height:1.4;color:var(--dim)}
.term-text .req,.term-text .opt{color:var(--text);font-weight:500}
.term-link{color:var(--text);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
/* 완료 */
.suc-wrap{display:block}
.suc-ico-big{display:none}
.suc-title-big{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.suc-sub-big{margin-top:8px;font-size:15px;line-height:1.45;color:var(--dim)}
.acct-card{position:relative;margin-top:26px}
.acct-card-label{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.acct-card-num{margin-top:8px;font-weight:200;font-size:clamp(34px,10.5vw,44px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.acct-card-meta{margin-top:18px;border-top:1px solid var(--line)}
.acct-card-meta div{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:17px}
.acct-card-meta .l{width:132px;font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.acct-card-meta .v{font-variant-numeric:tabular-nums}
.copy-btn{position:absolute;right:0;top:0;background:none;border:none;font-family:inherit;font-size:15px;color:var(--acc);cursor:pointer}
.suc-wrap > div[style*="display:flex"]{margin-top:12px;font-size:13.5px!important;color:var(--dim)!important}
/* 아래 버튼 */
.foot{margin-top:30px}
.primary-btn{width:100%;height:54px;border:none;border-radius:27px;background:var(--acc);color:var(--on-acc);font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .14s}
.primary-btn[style*="#bdbdbd"]{background:var(--surface)!important;color:#5A5A5E}     /* 아직 못 누르는 상태 (스크립트가 회색을 인라인으로 준다) */
.primary-btn:disabled{background:var(--surface);color:var(--dim)}
.primary-btn:not(:disabled):active{transform:scale(.98)}
.secondary-btn{width:100%;margin-top:14px;height:44px;background:none;border:none;font-family:inherit;font-size:15px;color:var(--dim);cursor:pointer}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#2C2C2E;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;max-width:calc(100vw - 32px);text-align:center;display:none;z-index:300}
/* 국가 고르기 창 */
.csheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.csheet-bg.open{display:flex}
.csheet{width:100%;max-width:480px;max-height:82vh;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.csheet-grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}
.csheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
.csheet-ttl{font-size:17px;font-weight:600}
.csheet-x{width:32px;height:32px;border-radius:16px;background:#2C2C2E;border:none;color:var(--text);cursor:pointer}
.csheet-search{margin:4px 20px 8px;padding:0 14px;height:40px;border-radius:20px;background:#2C2C2E;display:flex;align-items:center}
.csheet-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--text)}
.csheet-search input::placeholder{color:var(--mute)}
.csheet-list{overflow-y:auto;padding:0 20px 12px}
.cs-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cs-flag{width:34px;font-size:12px;font-weight:600;color:var(--dim)}
.cs-name{flex:1;font-size:16px;color:var(--text)}
.cs-dial{font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.cs-chk{width:9px;height:9px;border-radius:50%}
.cs-item.sel .cs-chk{background:var(--acc)}
.cs-empty{padding:30px 0;text-align:center;color:var(--dim);font-size:15px}
@media (min-width:821px){ .csheet-bg{align-items:center} .csheet{border-radius:18px} }
@media (max-width:820px){
  .lg-head{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 8px}
  .lg-main{grid-template-columns:1fr;gap:0;padding:6px 20px 26px;align-items:start;align-content:start}
  .face{display:none}
  #wrap{max-width:none;justify-self:stretch}
  .lg-foot{padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
}
</style>
<script>
/* FX 사이트에서 Open account 로 넘어왔을 때만 Alpexa-FX 브랜드 (로그인 화면과 같은 판정 — 같은 출처 referrer). */
(function(){try{ var r=document.referrer||''; if(!r) return; var a=document.createElement('a'); a.href=r;

}catch(e){}})();

// ── Validation ──
function validPersonal(){
  return data.firstName.trim() && data.lastName.trim()
    && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)
    && data.phone.trim().length >= 7
    && data.dob && data.country
    && ageOk(data.dob)            // C2: 18+ only
    && !countryBlocked(data.country);  // C3: no sanctioned jurisdiction
}
// Compliance gates (logic lives in compliance.js — single source w/ tests). Fail
// CLOSED if the module didn't load: better to block signup than to skip a legal gate.
function ageOk(dob){
  return !!(window.AlpexaCompliance && AlpexaCompliance.meetsMinAge(dob));
}
function countryBlocked(name){
  return !window.AlpexaCompliance || AlpexaCompliance.isSanctionedName(name);
}
function validSecurity(){
  return data.password.length >= 8 && data.pin.length === 4
    && data.termsMain && data.termsRisk;
}
function pwStrength(pw){
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
  if (!pw) return { score:0, label:'Use 8+ characters with a mix of cases, numbers, and symbols' };
  return { score, label: ['Too short','Weak','Fair','Good','Strong'][score] || 'Strong' };
}
function updateStrength(){
  const r = pwStrength(data.password);
  const bars = document.getElementById('strBars');
  if (bars) bars.innerHTML = [1,2,3,4].map(n => `<div class="s-bar ${n <= r.score ? 'f'+r.score : ''}"></div>`).join('');
  const txt = document.getElementById('strTxt');
  if (txt) txt.textContent = r.label;
  const foot = document.getElementById('foot');
  if (foot) foot.innerHTML = footBtns('Create Account', validSecurity(), 3);
}

// ── Setters ──
function setData(k,v){ data[k]=v; if(k==='server' && (v==='stocks'||v==='demo')){ data.leverage='1:1'; data.currency='USDT'; } renderStep(); }
// Date of Birth: 3 typed number boxes → assemble YYYY-MM-DD into data.dob (same format
// as before, so ageOk()/DB save are unchanged). No native calendar → consistent on Samsung.
function dobInput(el){
  el.value = el.value.replace(/\D/g,'');
  var wrap = el.closest('.dob3');
  var yy = wrap.querySelector('[data-dp=y]').value;
  var mm = wrap.querySelector('[data-dp=m]').value;
  var dd = wrap.querySelector('[data-dp=d]').value;
  var dp = el.getAttribute('data-dp');
  if (dp==='y' && el.value.length===4) wrap.querySelector('[data-dp=m]').focus();
  else if (dp==='m' && el.value.length===2) wrap.querySelector('[data-dp=d]').focus();
  // Only a complete, sane date sets a valid dob; otherwise blank (button stays disabled).
  var dob = (yy.length===4 && +mm>=1 && +mm<=12 && +dd>=1 && +dd<=31)
    ? (yy + '-' + mm.padStart(2,'0') + '-' + dd.padStart(2,'0')) : '';
  setField('dob', dob);
}
function setField(k,v){
  data[k]=v;
  const foot = document.getElementById('foot');
  if (cur === 1) foot.innerHTML = footBtns('Continue', validPersonal(), 1);
  if (cur === 3) foot.innerHTML = footBtns('Create Account', validSecurity(), 3);
}

// ── PIN handling ──
function pinInput(i, v){
  v = v.replace(/[^0-9]/g,'').slice(0,1);
  data.pin = (data.pin.slice(0,i) + v + data.pin.slice(i+1)).slice(0,4);
  const cells = document.querySelectorAll('.pin-cell');
  cells[i].value = v;
  if (v && i < 3) cells[i+1].focus();
  cells.forEach((c,j) => c.classList.toggle('filled', !!data.pin[j]));
  const foot = document.getElementById('foot');
  if (foot) foot.innerHTML = footBtns('Create Account', validSecurity(), 3);
}
function pinKey(e, i){
  if (e.key === 'Backspace' && !e.target.value && i > 0) {
    document.querySelectorAll('.pin-cell')[i-1].focus();
  }
}

// ── OTP handling ──
function otpInput(i, v){
  v = v.replace(/[^0-9]/g,'').slice(0,1);
  data.otp = (data.otp.slice(0,i) + v + data.otp.slice(i+1)).slice(0,6);
  const cells = document.querySelectorAll('.otp-cell');
  cells[i].value = v;
  if (v && i < 5) cells[i+1].focus();
  cells.forEach((c,j) => c.classList.toggle('filled', !!data.otp[j]));
  const foot = document.getElementById('foot');
  foot.innerHTML = footBtns('Verify', data.otp.length === 6, 2);
}
function otpKey(e, i){
  if (e.key === 'Backspace' && !e.target.value && i > 0) {
    document.querySelectorAll('.otp-cell')[i-1].focus();
  }
}
function resendOTP(){
  data.otp = '';
  document.querySelectorAll('.otp-cell').forEach(c => { c.value = ''; c.classList.remove('filled'); });
  const errEl = document.getElementById('otpError');
  if (errEl) errEl.style.display = 'none';
  startResendTimer();
  startOTPTimer();
  sendEmailOtp();
}
function generateOTP(){
  let c = '';
  for (let i = 0; i < 6; i++) c += Math.floor(Math.random() * 10);
  return c;
}
// Send a REAL 6-digit verification code to the email via Supabase Auth.
async function sendEmailOtp(){
  try{
    if(!window._db){ showToast('No server connection.'); return; }
    showToast('Sending a code to ' + data.email + '…');
    const r = await window._db.auth.signInWithOtp({ email: data.email, options: { shouldCreateUser: true } });
    if(r && r.error){ showToast('Could not send code: ' + r.error.message); }
    else { showToast('6-digit code sent to ' + data.email); }
  }catch(e){ showToast('Could not send code. Tap Resend.'); }
}
// Verify the code the user typed against the real email OTP.
async function verifyEmailCode(){
  const errEl = document.getElementById('otpError');
  const showErr = (m)=>{ if(errEl){ errEl.textContent=m; errEl.style.display='block'; }
    document.querySelectorAll('.otp-cell').forEach(c=>{ c.style.borderColor='#e53935'; c.style.animation='shake 0.3s'; setTimeout(()=>{c.style.animation='';c.style.borderColor='';},400); }); };
  try{
    if(!window._db){ showErr('No server connection.'); return; }
    const r = await window._db.auth.verifyOtp({ email: data.email, token: data.otp, type: 'email' });
    if(r && r.error){ showErr('Incorrect or expired code. Check your email and try again.'); return; }
    if(errEl) errEl.style.display='none';
    cur = 3; renderStep();
  }catch(e){ showErr('Verification failed. Please try again.'); }
}
let resendTimer = null;
function startResendTimer(){
  let sec = 30;
  const btn = document.getElementById('resendBtn');
  if (!btn) return;
  btn.disabled = true;
  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    sec--;
    if (btn) btn.textContent = `Resend code (${sec}s)`;
    if (sec <= 0) {
      clearInterval(resendTimer);
      if (btn) { btn.disabled = false; btn.textContent = 'Resend code'; }
    }
  }, 1000);
}
let otpTimerInt = null;
function startOTPTimer(){
  let sec = 179;
  clearInterval(otpTimerInt);
  otpTimerInt = setInterval(() => {
    sec--;
    const m = Math.floor(sec/60), s = sec%60;
    const el = document.getElementById('otpTimer');
    if (el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (sec <= 0) {
      clearInterval(otpTimerInt);
      // Code expired → say so and let them resend immediately (don't leave a frozen 00:00).
      if (el) { el.textContent = 'expired'; el.style.color = '#e53935'; }
      const rb = document.getElementById('resendBtn');
      if (rb) { rb.disabled = false; rb.textContent = 'Resend code'; }
      if (resendTimer) { clearInterval(resendTimer); resendTimer = null; }
    }
  }, 1000);
}

// ── Pw toggle ──
function togglePw(){
  const inp = document.getElementById('pwInput');
  const ico = document.getElementById('eyeIcon');
  if (inp.type === 'password') { inp.type = 'text'; ico.textContent = 'visibility_off'; }
  else { inp.type = 'password'; ico.textContent = 'visibility'; }
}

// ── Nav ──
async function createOnServer(){
  var cust='P-'+Math.floor(1000+Math.random()*9000);
  function aN(p){return p+'-'+Math.floor(100000+Math.random()*900000);}
  data.custId=cust; data.accts={sports:aN('SP'),crypto:aN('CR'),fx:aN('FX')}; data.acctNum=data.accts.sports;
  if(!window._db) throw new Error('No server connection');
  var fullName=(data.firstName+' '+data.lastName).trim();
  // The auth user was already created AND email-verified at the OTP step (step 3).
  // Now set the chosen password on it, then read its id.
  var up=await window._db.auth.updateUser({ password:data.password });
  if(up && up.error) throw new Error(up.error.message||'Could not set your password');
  var who=await window._db.auth.getUser();
  var authId=(who && who.data && who.data.user) ? who.data.user.id : null;
  if(!authId) throw new Error('Your email is not verified yet — go back and enter the code.');
  // 2) ONE PLAYER PER AUTH USER (email). If this auth user already has a profile, REUSE it —
  //    re-signing up with the same email must NOT create a duplicate account; it just logs
  //    into the existing one. (This was the cause of 8 accounts for one email.)
  var existing=await window._db.from('players').select('id,cust_id').eq('auth_id',authId).limit(1);
  if(existing && existing.data && existing.data.length){
    var pid=existing.data[0].id;
    data.custId=existing.data[0].cust_id;
    var ea=await window._db.from('accounts').select('server,acct_no').eq('player_id',pid);
    var am={}; (ea.data||[]).forEach(function(a){ if(a.server) am[a.server]=a.acct_no; });
    data.accts={sports:am.sports||'',crypto:am.crypto||'',fx:am.fx||''}; data.acctNum=data.accts.sports;
  } else {
    // New auth user → create the profile + its three accounts.
    var playerRow={cust_id:cust,name:fullName,email:data.email,auth_id:authId,
      phone:data.phone||'',dob:data.dob||'',country:data.country||'',
      server:data.server||'',leverage:data.leverage||'',currency:data.currency||''};
    var r1=await window._db.from('players').insert(playerRow).select().single();
    // Fallback: if extended columns aren't there yet, save the core fields.
    if(r1&&r1.error){ r1=await window._db.from('players').insert({cust_id:cust,name:fullName,email:data.email,auth_id:authId}).select().single(); }
    if(r1.error) throw r1.error;
    // 신규 가입 오프닝은 전부 0 (2026-08-16 가입 보너스 폐지). 어차피 서버 트리거
    // force_opening_balance 가 값을 덮지만, 클라에도 의도를 남기지 않는다.
    var rows=[{player_id:r1.data.id,server:'sports',acct_no:data.accts.sports,balance:0},{player_id:r1.data.id,server:'crypto',acct_no:data.accts.crypto,balance:0},{player_id:r1.data.id,server:'fx',acct_no:data.accts.fx,balance:0}];
    var r2=await window._db.from('accounts').insert(rows);
    if(r2.error) throw r2.error;
  }
  cust=data.custId;   // downstream (referral, alpexa.me) must use the REAL player cust_id
  // Referral: if a valid agent code was entered, auto-link this customer to
  // that agent (100% share). Never blocks signup if anything goes wrong.
  try{
    var rc=(data.refCode||'').trim().toUpperCase();
    if(rc){
      var ar=await window._db.from('agents').select('code').eq('code',rc).limit(1);
      if(ar && ar.data && ar.data.length){
        await window._db.from('agent_links').insert({agent_code:rc,cust_id:cust,share:100});
      } else {
        // Customer referral: record it so the referrer earns their bonus once this
        // new account makes its first $50 deposit (paid server-side by a trigger).
        // RPC is SECURITY DEFINER; if it isn't installed yet this fails silently.
        try{ await window._db.rpc('record_referral', { p_referrer: rc, p_referee: cust }); }catch(e){}
      }
    }
  }catch(e){}
  // A new signup is always a fresh account — clear any previous account's cached money
  // data on this device so balances/positions don't carry over.
  try{ ['alpexa.serverBalances','alpexa.balances','alpexa.cryptoHoldings','alpexa.staked','alpexa.sportsBalance','alpexa.cryptoBalance','alpexa.fxLive','alpexa.openBets','alpexa.settledBets','alpexa.positions','alpexa.cacheOwner','alpexa.withdrawals','alpexa.transactions','alpexa.funding','alpexa.txns','alpexa.appliedTransfers','alpexa.customer','alpexa.openDeposit','alpexa.ownerFunded'].forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} }); }catch(e){}
  // #5: 가입 보너스는 2026-08-16 폐지 — 신규 계정은 세 서버 모두 $0 으로 열린다.
  // 오프닝은 서버 트리거(force_opening_balance)가 정하고, 클라는 매 로드마다 서버에서
  // 실제 잔고를 받아 표시만 한다 (돈을 localStorage 에 심지 않는다).
  // Remember who this is on the device so the apps can tag their transactions.
  try{ localStorage.setItem('alpexa.me', JSON.stringify({
    custId:cust, name:fullName, email:data.email, authId:authId,
    accts:data.accts })); }catch(e){}
  // Remember the chosen server so Login defaults back to it.
  try{ localStorage.setItem('alpexa.lastServer', data.server==='demo'?'sports':data.server==='stocks'?'crypto':'fx'); }catch(e){}
  // Carry the chosen FX leverage into the FX app (crypto/sports are spot 1:1).
  try{
    if(data.server==='live'){
      var n=parseInt((data.leverage||'1:100').split(':')[1])||100;
      localStorage.setItem('alpexa.leverage', JSON.stringify({FX:n,INDEX:20,STOCK:10,CRYPTO:10}));
    }
  }catch(e){}
}
function nextStep(){
  if (cur === 0) { cur = 1; renderStep(); }
  else if (cur === 1) {
    if (!validPersonal()) return;
    cur = 2;
    renderStep();
    startOTPTimer();
    startResendTimer();
    sendEmailOtp();   // send a real 6-digit code to the email
  }
  else if (cur === 2) {
    if (data.otp.length !== 6) return;
    verifyEmailCode();   // checks the code; on success advances to Security
  }
  else if (cur === 3) {
    if (!validSecurity()) return;
    // Create the account on the server.
    const foot = document.getElementById('foot');
    foot.innerHTML = `<button class="primary-btn" disabled><div style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></div> Creating account…</button>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
    createOnServer().then(function(){ cur = 4; renderStep(); })
      .catch(function(err){ var m=(err&&err.message)||String(err); alert('Could not create your account:\n\n'+m); cur=3; renderStep(); });
  }
}
function goBack(){
  if (cur === 0 || cur === 4) { window.location.href = 'login.html'; return; }
  cur = Math.max(0, cur - 1); renderStep();
}
function goToApp(){
  var dest = data.server==='demo' ? 'sports-live.html' : data.server==='stocks' ? 'crypto-live.html' : 'fx-app.html';
  // Carry the identity in the URL so that if the user "Adds to Home Screen" from
  // the app, the installed app (which has separate iOS storage) can restore the
  // same account automatically — no re-login needed.
  try{
    var me={custId:data.custId,name:(data.firstName+' '+data.lastName).trim(),email:data.email,accts:data.accts};
    dest += '#alpexa='+btoa(encodeURIComponent(JSON.stringify(me)));
  }catch(e){}
  window.location.href = dest;
}
function copyAcct(){
  if (data.acctNum) { navigator.clipboard?.writeText(data.acctNum); showToast('Account number copied'); }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function openCountrySheet(){
  document.getElementById('csheetBg').classList.add('open');
  document.getElementById('csheetSearch').value='';
  renderCountries(COUNTRIES);
  setTimeout(()=>document.getElementById('csheetSearch').focus(),120);
}
function closeCountrySheet(e){
  if (e && e.target && e.target.id !== 'csheetBg') return;
  document.getElementById('csheetBg').classList.remove('open');
}
function renderCountries(list){
  const el = document.getElementById('csheetList');
  if (!list.length) { el.innerHTML = '<div class="cs-empty">No countries match your search.</div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="cs-item ${data.country===c.name?'sel':''}" onclick="selectCountry('${c.name.replace(/'/g,"\\'")}','${c.dial}')">
      <div class="cs-flag">${c.code}</div>
      <div class="cs-name">${c.name}</div>
      <div class="cs-dial">${c.dial}</div>
      <span class="msi cs-chk">check_circle</span>
    </div>
  `).join('');
}
function filterCountries(q){
  q = q.trim().toLowerCase();
  if (!q) { renderCountries(COUNTRIES); return; }
  renderCountries(COUNTRIES.filter(c =>
    c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.dial.includes(q)
  ));
}
function selectCountry(name, dial){
  // C3 geo gate: refuse a sanctioned jurisdiction outright (don't even set it).
  if (countryBlocked(name)) {
    closeCountrySheet({target:{id:'csheetBg'}});
    showToast('Sorry — Alpexa is not available in ' + name + '.');
    return;
  }
  data.country = name;
  if (!data.phone.trim() && dial) {
    data.phone = dial + ' ';
  }
  closeCountrySheet({target:{id:'csheetBg'}});
  renderStep();
}

renderStep();
</script>
<script>
/* 표시 전용 (가입 로직과 분리): 왼쪽 큰 숫자 = 지금 단계 · 단계 목록. 가입 스크립트가 진행 표시를 다시 그릴 때마다 따라 읽는다.
   FX 사이트에서 왔으면 FX 계좌를 기본으로 골라 둔다(손님이 FX 알약을 누른 것과 같은 호출). */
(function(){ try{
  var fromFx=document.documentElement.classList.contains('from-fx'), brand=document.getElementById('lgBrand'); if(brand) brand.setAttribute('href',fromFx?'fx.html':'/');
  var n=document.getElementById('faceN'), of=document.getElementById('faceOf'), ol=document.getElementById('faceSteps'), prog=document.getElementById('progress');
  function sync(){ if(!n||!ol||typeof cur!=='number'||typeof STEPS==='undefined') return;
    n.textContent=String(cur+1); of.textContent='of '+STEPS.length;
    ol.innerHTML=''; STEPS.forEach(function(t,i){ var li=document.createElement('li'), a=document.createElement('span'), b=document.createElement('i'); li.className=i===cur?'on':(i<cur?'done':''); a.textContent=t; b.textContent=i<cur?'Done':(i===cur?'Now':''); li.appendChild(a); li.appendChild(b); ol.appendChild(li); }); }
  if(prog&&'MutationObserver' in window) new MutationObserver(sync).observe(prog,{childList:true});
  sync();
  if(fromFx&&typeof setData==='function'&&typeof data==='object'&&data.server==='demo'&&cur===0) setData('server','live');
}catch(e){} })();
</script>
