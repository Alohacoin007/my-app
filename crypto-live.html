<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; min-height: 100vh;
    font-family: 'Geist', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; color: #0E0E0E; }
  * { box-sizing: border-box; }
  .stage { min-height: var(--app-vh, 100vh); display: flex; align-items: center; justify-content: center;
    padding: 20px; background: #FFFFFF; }
  /* Wide / desktop preview: cap the phone to the REAL visible height (--app-vh is the
     JS-measured visualViewport height, so it excludes a mobile browser's toolbars —
     plain 100vh overestimates there and pushed the bottom buttons behind the bar).
     Keeps the bottom buttons visible on every screen. Mobile (<=600) is full-screen below. */
  @media (min-width: 601px) {
    .phone-shell { max-height: calc(var(--app-vh, 100svh) - 40px) !important; }
  }
  .phone-shadow { border-radius: 54px; box-shadow:
    0 50px 90px -30px rgba(0,0,0,0.28),
    0 24px 48px -24px rgba(0,0,0,0.18),
    0 0 0 1px rgba(0,0,0,0.06); }
  /* On a real phone: render at the device's own size (NO zoom) so text stays crisp
     and the footer pins to the bottom of a normal flex column — like the FX app.
     Height comes from CSS (100dvh) so Safari's address bar can't make the footer
     jump. */
  @media (max-width: 600px) {
    html, body { background: #FFFFFF !important; height: var(--app-vh, 100dvh) !important; min-height: 0 !important; overflow: hidden !important; overscroll-behavior: none !important; }
    .stage { padding: 0 !important; min-height: 0 !important; height: var(--app-vh, 100dvh) !important; overflow: hidden !important; background: #FFFFFF !important; display: block !important; }
    #phone.phone-shadow { box-shadow: none !important; border-radius: 0 !important; width: 100vw; height: var(--app-vh, 100dvh); overflow: hidden; }
    .phone-shell { border-radius: 0 !important;
      width: 100% !important;
      height: 100% !important;
      transform: none !important; }
    .fake-statusbar { display: none !important; }
  }
  /* Installed app: no Safari toolbar — use full 100vh so the footer reaches the
     physical bottom, and keep a thin notch spacer up top. */
  @media (max-width: 600px) and (display-mode: standalone) {
    html, body, .stage { height: 100vh !important; }
    #phone.phone-shadow { height: 100vh !important; }
    .fake-statusbar { display: block !important; height: env(safe-area-inset-top) !important; min-height: 0 !important; padding: 0 !important; overflow: hidden !important; visibility: hidden !important; }
  }
  .alpexa-hide-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .alpexa-hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* Kill the browser autofill yellow highlight — paint the field with the app's
     own surface color (set per theme via --alpexa-field-bg) instead. */

  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  textarea:-webkit-autofill,
  select:-webkit-autofill {

    -webkit-text-fill-color: var(--alpexa-field-fg, #0F1419) !important;
    caret-color: var(--alpexa-field-fg, #0F1419);
    transition: background-color 9999s ease-in-out 0s !important;

  @keyframes alpexa-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

<script>
  /* Pin the app to the ACTUAL visible height. In-app browsers (KakaoTalk,
     Instagram, etc.) report 100dvh wrong, which left a white gap under the
     footer (footer "floated up"). window.innerHeight is reliable there, so we
     mirror it into --app-vh and the mobile CSS heights use that. */
  (function(){
    function setVH(){
      try{
        // visualViewport.height = the ACTUAL visible area in Safari (excludes the
        // top/bottom toolbars), so the footer lands on the real bottom and the
        // bottom holdings (Securities/Staked) aren't hidden behind Safari's bar.
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        document.documentElement.style.setProperty('--app-vh', Math.round(h) + 'px');
      }catch(e){}
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', setVH);
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', setVH);
      window.visualViewport.addEventListener('scroll', setVH);
    }
    // Safari settles its toolbars a beat after load — re-measure shortly after.
    setTimeout(setVH, 300);
    window.addEventListener('load', setVH);
  })();
</script>

<script>
/* One-time crypto reset: open crypto-live.html?reset=1 to clear stale local crypto
   holdings/balances on THIS device, then re-login so it re-seeds clean from the server. */
(function(){try{ if(/[?&]reset=1/.test(location.search)){ ['alpexa.cryptoHoldings','alpexa.staked','alpexa.serverBalances','alpexa.balances','alpexa.me'].forEach(function(k){ localStorage.removeItem(k); }); location.replace('login.html?switch=1'); } }catch(e){}})();
/* Restore identity from the URL (#alpexa=...) so a home-screen install can inherit the account created in Safari (iOS isolates their storage) - no re-login. */
(function(){try{var m=(location.hash||"").match(/alpexa=([^&]+)/);if(m){var id=JSON.parse(decodeURIComponent(atob(m[1])));if(id&&id.accts){localStorage.setItem("alpexa.me",JSON.stringify(id));}}}catch(e){}})();
/* (removed cacheOwner guard — #5: holdings/stakes are no longer in localStorage, so there's nothing to bleed; the adopt loop pulls server holdings.) */
/* Login gate (real service): no anonymous guest trading. Require a logged-in identity (email or authId); guests/empty go to login. */
(function(){try{var m=JSON.parse(localStorage.getItem("alpexa.me")||"null");if(!(m&&m.accts&&(m.email||m.authId))){location.replace("login.html");}}catch(e){location.replace("login.html");}})();
/* Default to the light (white) theme. One-time migration flips existing devices
   (which auto-saved 'dark' under the old default) to light; after that the user's
   manual Dark/Light choice in Account → Appearance is respected. */
(function(){try{if(!localStorage.getItem("alpexa.themeDefaultLight")){localStorage.setItem("alpexa.theme",JSON.stringify("light"));localStorage.setItem("alpexa.themeDefaultLight","1");}}catch(e){}})();
</script>

<script>
/* Session guard. The identity gate above only checks alpexa.me (a local name tag).
   But reading your OWN holdings/positions needs a real Supabase auth SESSION —
   without it, RLS hides every row and the wallet looks EMPTY ("my coins vanished"),
   which is exactly what happens when the app is opened via a shared #alpexa link or
   after the session expired. So: if Supabase is reachable and there is NO session,
   send the user to log in (which establishes one). Guarded with a per-tab flag so it
   can never loop, and silent if Supabase is simply unreachable (offline degraded). */
(function(){
  try {
    if (!window.AlpexaSync || !AlpexaSync.db || !AlpexaSync.db.auth) return;
    var m = JSON.parse(localStorage.getItem("alpexa.me")||"null");
    if (!(m && m.accts)) return;                          // no identity → handled by the gate above
    if (sessionStorage.getItem("alpexa.sessChecked")) return; // already checked this tab → no loop
    AlpexaSync.db.auth.getSession().then(function(r){
      var hasSession = !!(r && r.data && r.data.session);
      if (!hasSession) {
        sessionStorage.setItem("alpexa.sessChecked","1");  // set BEFORE redirect → cannot loop
        location.replace("login.html?expired=1");
      }
    }).catch(function(){ /* Supabase unreachable → stay in local degraded mode */ });
    // Identity guard: if the auth session doesn't OWN this displayed account, re-login.
    AlpexaSync.assertIdentity();
  } catch(e) {}
})();
</script>

<script>
// Mobile fit: stretch the fixed 390x844 design to fill the REAL visible viewport.
// Uses visualViewport so it auto-corrects when Safari's address bar shows/hides
// (no more manual nudge after switching servers).
(function(){
  var root=document.documentElement;
  var baseH=0; // largest stable viewport height seen (keyboard closed)
  var phoneEl=document.getElementById('phone');
  function fit(){
    if(window.innerWidth<=600){
      if(phoneEl){ phoneEl.style.zoom=''; phoneEl.style.transform=''; }  // mobile = full screen, no scale
      var w=(window.visualViewport&&window.visualViewport.width)||window.innerWidth;
      var h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
      var s=w/390;                                  // UNIFORM scale by width — no squished text
      root.style.setProperty('--ph-s', s);
      // Keyboard open (viewport shrinks >150px): DON'T bump baseH, so the full height
      // restores when the keyboard closes. But still re-fit the frame to the *visible*
      // height — otherwise the bottom CTA (Withdraw / Verify & send) sits below the
      // keyboard, off-screen and unreachable. Shrinking the frame keeps it visible.
      var keyboardOpen = baseH && h < baseH - 150;
      if(!keyboardOpen && h > baseH) baseH = h;
      root.style.setProperty('--ph-ph', (h/s)+'px'); // design height so scaled = real height
      root.style.setProperty('--ph-vh', h+'px');
    } else {
      // Wide / desktop preview: shrink the fixed 390×844 mock so the WHOLE phone —
      // including the bottom buttons on EVERY screen — always fits the window. Using
      // CSS zoom (not transform) also shrinks the layout box, so it centers cleanly
      // with no overflow/scroll. This is global: one fit covers all screens.
      // Desktop preview: no scaling (it broke rendering / isn't universally supported).
      // The phone height is capped via CSS (.phone-shell max-height) so its internal
      // scroll keeps the bottom buttons visible. Clear any stale inline scale.
      if(phoneEl){ phoneEl.style.transform=''; phoneEl.style.zoom=''; }
      root.style.removeProperty('--ph-s');
      root.style.removeProperty('--ph-ph');
      root.style.removeProperty('--ph-vh');
    }
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ baseH=0; fit(); setTimeout(fit,300); });
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
  // catch the address-bar settle right after load
  [60,150,300,600,1000].forEach(function(ms){ setTimeout(fit, ms); });
})();
</script>
<script>
// Server-authoritative balances: keep the cross-app balances (server-switcher
// dropdown) in sync with the server on load / focus / every 10s. Crypto's own
// home total is holdings-based (full holdings sync comes next); this makes the
// dropdown + other-server numbers correct on refresh without re-login.
(function(){
  function syncBalances(){
    if(!(window.AlpexaSync&&AlpexaSync.pullBalances)) return;
    AlpexaSync.pullBalances().then(function(b){
      if(!b) return;
      try{ var o=window.__srvBal||{};
        if(b.fx!=null)o.fx=b.fx; if(b.sports!=null)o.sports=b.sports; if(b.crypto!=null)o.crypto=b.crypto;
        window.__srvBal=o;
        window.dispatchEvent(new Event('alpexa-balance-change')); }catch(e){}
    }).catch(function(){});
  }
  setTimeout(syncBalances,1200);
  setInterval(function(){ if(!document.hidden) syncBalances(); },10000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) syncBalances(); });
})();
</script>

<script>
/* Report crypto holdings + stakes to the server for the back office. */
(function(){
  function meX(){try{var m=JSON.parse(localStorage.getItem('alpexa.me')||'null');return m&&m.accts?m:null;}catch(e){return null;}}
  // M4-1: Identity auto-refresh. On every load, pull THIS user's current cust_id +
  // account numbers from the server and rewrite alpexa.me. This kills cust_id drift
  // structurally (no re-login needed) so positions/online/P&L always line up.
  function refreshMe(){ try{
    if(!window.AlpexaSync||!AlpexaSync.db)return;
    var m; try{m=JSON.parse(localStorage.getItem('alpexa.me')||'null');}catch(e){return;}
    if(!m||(!m.authId&&!m.email))return;
    var q=AlpexaSync.db.from('players').select('id,cust_id,name,email,auth_id');
    if(m.authId) q=q.eq('auth_id',m.authId); else q=q.ilike('email',m.email);
    q.order('created_at',{ascending:true}).limit(1).then(function(r){
      var p=r&&r.data&&r.data[0]; if(!p)return;
      AlpexaSync.db.from('accounts').select('server,acct_no').eq('player_id',p.id).then(function(r2){
        var accts={}; (r2&&r2.data||[]).forEach(function(a){ accts[a.server]=a.acct_no; });
        if(!accts.fx&&!accts.crypto&&!accts.sports)return; // never wipe identity if accounts are missing
        var merged=Object.assign({},m,{custId:p.cust_id,name:p.name||m.name,email:p.email||m.email,authId:p.auth_id||m.authId,accts:accts});
        localStorage.setItem('alpexa.me',JSON.stringify(merged));
      },function(){});
    },function(){});
  }catch(e){} }
  setTimeout(refreshMe,800);
  // Record one finished event (trade fee etc.) on the server for company P&L.
  window.__alpexaSettle=function(rec){ try{ if(!window.AlpexaSync||!AlpexaSync.db)return; var m=meX(); if(!m)return;
    AlpexaSync.db.from('settlements').insert({cust_id:m.custId,acct_no:(m.accts&&m.accts[rec.server])||'',server:rec.server||'',kind:rec.kind||'',local_id:String(rec.local_id||''),ticket:String(rec.ticket||''),symbol:rec.symbol||'',stake:Math.round((+rec.stake||0)*100)/100,pnl:Math.round((+rec.pnl||0)*100)/100,detail:rec.detail||''}).then(function(){},function(){});
  }catch(e){} };
  function push(){
    // #5/B: crypto holdings & stakes truth lives in crypto_holdings / crypto_stakes
    // (server, RPC-only writes). The old localStorage→positions mirror is RETIRED — it
    // read now-empty localStorage and DELETED crypto positions every cycle. The back
    // office reads the real tables directly. This is now just the presence heartbeat.
    if(!window.AlpexaSync||!AlpexaSync.db)return;
    var m=meX(); if(!m||!m.accts.crypto)return; var cust=m.custId;
    AlpexaSync.db.from('players').update({last_seen:new Date().toISOString(),last_app:'crypto'}).eq('cust_id',cust).then(function(){},function(){});
  }
  setTimeout(push,2000); setInterval(function(){ if(!document.hidden) push(); },8000);
  // Dealing-desk: per-coin buy/sell markup % set in the back office.
  window.__alpexaCryptoMarks=window.__alpexaCryptoMarks||{};
  function pullCryptoMarks(){ if(!window.AlpexaSync||!AlpexaSync.db)return;
    AlpexaSync.db.from('pricing_marks').select('symbol,markup_pts').then(function(r){
      if(r&&r.data){ var m={}; r.data.forEach(function(p){ m[p.symbol]=Math.max(0,Math.min(50,+p.markup_pts||0)); }); window.__alpexaCryptoMarks=m; }
    },function(){}); }
  setTimeout(pullCryptoMarks,1300); setInterval(function(){ if(!document.hidden) pullCryptoMarks(); },5000);
  // Kill switch: read the back-office trading-halt flag.
  window.__alpexaHalt=false;
  function pullHalt(){ if(!window.AlpexaSync||!AlpexaSync.db)return;
    AlpexaSync.db.from('controls').select('val').eq('key','trading_halt').limit(1).then(function(r){
      window.__alpexaHalt=!!(r&&r.data&&r.data[0]&&r.data[0].val==='1'); },function(){}); }
  setTimeout(pullHalt,1500); setInterval(function(){ if(!document.hidden) pullHalt(); },5000);
  // (Removed the holdings-change→push trigger and its localStorage posSig — the positions
  //  mirror it fed is retired (B). crypto_holdings/crypto_stakes are the server truth.)
  // Lightweight presence heartbeat — runs even in the background.
  function beat(){ if(!window.AlpexaSync||!AlpexaSync.db)return; var m=meX(); if(!m)return;
    var patch={last_seen:new Date().toISOString(),last_app:'crypto'};
    if(m.email) AlpexaSync.db.from('players').update(patch).ilike('email',m.email).then(function(){},function(){});
    else if(m.custId) AlpexaSync.db.from('players').update(patch).eq('cust_id',m.custId).then(function(){},function(){}); }
  setTimeout(beat,1500); setInterval(beat,8000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) beat(); });
  /* Execute back-office commands (liquidate holding/stake to USDT). */
  function runCmds(){
    if(!window.AlpexaSync||!AlpexaSync.db)return; var m=meX(); if(!m||!m.accts.crypto)return; var cust=m.custId;
    AlpexaSync.db.from('commands').select('*').eq('cust_id',cust).eq('server','crypto').eq('status','pending').then(function(r){
      if(!r||!r.data||!r.data.length)return;
      r.data.forEach(function(c){ try{
        if(c.action==='set_balance'){ if(window.__alpexaCryptoSetBal) window.__alpexaCryptoSetBal(parseFloat(c.local_id)); }
        else if(window.__alpexaCryptoLiquidate) window.__alpexaCryptoLiquidate(c.local_id); }catch(e){}
        AlpexaSync.db.from('commands').update({status:'done'}).eq('id',c.id).then(function(){},function(){}); });
      setTimeout(push,1000);
    },function(){});
  }
  setTimeout(runCmds,4000); setInterval(function(){if(!document.hidden)runCmds();},4000);
})();
</script>
