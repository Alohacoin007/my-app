<!--
  ALPEXA FX — Robinhood-style mobile app, STAGE 1 (2026-09-17, 사장님 "시작해").
  ──────────────────────────────────────────────────────────────────────────────
  · READ-ONLY. 이 파일에는 돈을 움직이는 호출이 0줄이다: rpc() 없음, ledger/positions 쓰기 없음.
    주문·청산·SL/TP 버튼은 그려지지만 누르면 "Stage 2" 안내만 뜬다. (핀: tests/trading-rh.test.js)
  · 기존 trading.html 은 0터치. 같은 세션(alpexa-sync.js, sessionStorage)·같은 서버 데이터를 읽는다.
  · 시세 표시 = 딜링 락스텝: bid/ask = mid ∓ half, half = max(0.1, spr_pts + markup_pts) × pip / 2
    (trading.html fxHalfSpread / fx_close.sql v_half 와 동일). 플로팅 = 그 close 가격으로 계산.
  · 돈 잔고는 서버(accounts.balance)에서 매번 읽고 표시만 한다 — localStorage 에 돈 없음 (CLAUDE.md #5).
    로컬 저장은 UI 설정 3개뿐: 테마 · 1-Click 스위치 · 잔고 가림.
  · 디자인 = fx-mockup v57 (모던 라이트/다크, 로빈후드 그린 #00C805 / 오렌지 #FF5000).
-->

<script>
/* Login gate — same rule as trading.html: a logged-in identity (email or authId) is required. */
function rhToLogin(q){ try{ sessionStorage.setItem("alpexa.dest2","fx-rh"); }catch(e){} location.replace("../login.html"+(q||"")); }   /* 복귀 토큰(폐쇄 허용목록) — login.html fxDest 가 1회 소비 → 이 프리뷰로 돌아온다 */
(function(){try{var m=JSON.parse(localStorage.getItem("alpexa.me")||"null");if(!(m&&m.accts&&(m.email||m.authId))){rhToLogin("");}}catch(e){rhToLogin("");}})();
/* #5: money is never truth in localStorage — purge any legacy money keys on load. */
(function(){try{["alpexa.serverBalances","alpexa.balances","alpexa.fxLive","alpexa.positions"].forEach(function(k){localStorage.removeItem(k);});}catch(e){}})();
</script>
<script src="../alpexa-sync.js?v=16"></script>
<script>
/* Session guard (same as the crypto/FX apps): reading your own positions/balance needs a real
   Supabase auth SESSION — without it RLS hides every row. No session → login. Per-tab flag prevents loops. */
(function(){
  try {
    if (!window.AlpexaSync || !AlpexaSync.db || !AlpexaSync.db.auth) return;
    var m = JSON.parse(localStorage.getItem("alpexa.me")||"null");
    if (!(m && m.accts)) return;
    if (sessionStorage.getItem("alpexa.sessChecked")) return;
    AlpexaSync.db.auth.getSession().then(function(r){
      if (!(r && r.data && r.data.session)) { sessionStorage.setItem("alpexa.sessChecked","1"); rhToLogin("?expired=1"); }
    }).catch(function(){});
    if (AlpexaSync.assertIdentity) AlpexaSync.assertIdentity();
  } catch(e) {}
})();
</script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   DATA CONTRACTS (mirrors trading.html — keep in lockstep, never invent)
   ══════════════════════════════════════════════════════════════════════════════ */
// FX pairs shown (subset of fx_specs 'FX' class; the mockup's 12). digits = quote precision.
// ── Instrument catalog — trading.html SYMBOLS 미러 (cls·digits). 표시 여부는 **피드(prices) 존재**로 결정:
//    "피드 없는 상품은 거래목록에서 제외" (CLAUDE.md MT5 규율). 핵심 FX 12개만 피드 로드 전 스켈레톤으로 항상 보인다.
var CATALOG = [
  { sym:'EURUSD', name:'Euro / Dollar',   digits:5, cls:'FX' },
  { sym:'GBPUSD', name:'Pound / Dollar',  digits:5, cls:'FX' },
  { sym:'USDJPY', name:'Dollar / Yen',    digits:3, cls:'FX' },

  { sym:'EURGBP', name:'Euro / Pound',    digits:5, cls:'FX' },
  { sym:'EURJPY', name:'Euro / Yen',      digits:3, cls:'FX' },
  { sym:'GBPJPY', name:'Pound / Yen',     digits:3, cls:'FX' },
  { sym:'XAUUSD', name:'Gold',            digits:2, cls:'FX' },
  { sym:'XAGUSD', name:'Silver',          digits:3, cls:'FX' },
  { sym:'EURAUD', name:'Euro / Aussie',   digits:5, cls:'FX' }, { sym:'AUDJPY', name:'Aussie / Yen', digits:3, cls:'FX' },
  { sym:'CHFJPY', name:'Franc / Yen',     digits:3, cls:'FX' }, { sym:'EURCHF', name:'Euro / Franc',  digits:5, cls:'FX' },
  { sym:'USDKRW', name:'Dollar / Won',    digits:2, cls:'FX' }, { sym:'USDCNH', name:'Dollar / Yuan',  digits:5, cls:'FX' },
  { sym:'USDSGD', name:'Dollar / Sing',   digits:5, cls:'FX' }, { sym:'USDMXN', name:'Dollar / Peso',  digits:5, cls:'FX' },
  { sym:'BTCUSD', name:'Bitcoin',  digits:1, cls:'CRYPTO' }, { sym:'ETHUSD', name:'Ethereum', digits:2, cls:'CRYPTO' }, { sym:'SOLUSD', name:'Solana', digits:2, cls:'CRYPTO' },
  { sym:'XRPUSD', name:'XRP',      digits:4, cls:'CRYPTO' }, { sym:'ADAUSD', name:'Cardano',  digits:4, cls:'CRYPTO' }, { sym:'DOGEUSD', name:'Dogecoin', digits:4, cls:'CRYPTO' },
  { sym:'BNBUSD', name:'BNB',      digits:2, cls:'CRYPTO' }, { sym:'DOTUSD', name:'Polkadot', digits:3, cls:'CRYPTO' }, { sym:'AVAXUSD', name:'Avalanche', digits:3, cls:'CRYPTO' }, { sym:'LINKUSD', name:'Chainlink', digits:3, cls:'CRYPTO' },
  { sym:'SPACEX', name:'SpaceX', digits:2, cls:'STOCK' }, { sym:'AAPL', name:'Apple', digits:2, cls:'STOCK' }, { sym:'TSLA', name:'Tesla', digits:2, cls:'STOCK' }, { sym:'NVDA', name:'NVIDIA', digits:2, cls:'STOCK' },
  { sym:'MSFT', name:'Microsoft', digits:2, cls:'STOCK' }, { sym:'GOOGL', name:'Alphabet', digits:2, cls:'STOCK' }, { sym:'META', name:'Meta', digits:2, cls:'STOCK' }, { sym:'AMZN', name:'Amazon', digits:2, cls:'STOCK' },
  { sym:'NFLX', name:'Netflix', digits:2, cls:'STOCK' }, { sym:'AMD', name:'AMD', digits:2, cls:'STOCK' }, { sym:'JPM', name:'JPMorgan', digits:2, cls:'STOCK' }, { sym:'IONQ', name:'IonQ', digits:2, cls:'STOCK' },
  { sym:'RGTI', name:'Rigetti', digits:2, cls:'STOCK' }, { sym:'QBTS', name:'D-Wave', digits:2, cls:'STOCK' }, { sym:'QUBT', name:'Quantum Computing', digits:2, cls:'STOCK' }, { sym:'ARQQ', name:'Arqit', digits:2, cls:'STOCK' },
  { sym:'TSM', name:'TSMC', digits:2, cls:'STOCK' }, { sym:'INTC', name:'Intel', digits:2, cls:'STOCK' }, { sym:'QCOM', name:'Qualcomm', digits:2, cls:'STOCK' }, { sym:'AVGO', name:'Broadcom', digits:2, cls:'STOCK' },
  { sym:'ASML', name:'ASML', digits:2, cls:'STOCK' }, { sym:'MU', name:'Micron', digits:2, cls:'STOCK' }, { sym:'TXN', name:'Texas Instruments', digits:2, cls:'STOCK' }, { sym:'AMAT', name:'Applied Materials', digits:2, cls:'STOCK' },
  { sym:'LRCX', name:'Lam Research', digits:2, cls:'STOCK' }, { sym:'KLAC', name:'KLA', digits:2, cls:'STOCK' }, { sym:'PLTR', name:'Palantir', digits:2, cls:'STOCK' }, { sym:'SMCI', name:'Super Micro', digits:2, cls:'STOCK' },
  { sym:'ANET', name:'Arista', digits:2, cls:'STOCK' }, { sym:'CRWD', name:'CrowdStrike', digits:2, cls:'STOCK' }, { sym:'ARM', name:'Arm', digits:2, cls:'STOCK' }, { sym:'ORCL', name:'Oracle', digits:2, cls:'STOCK' },
  { sym:'NOW', name:'ServiceNow', digits:2, cls:'STOCK' }, { sym:'CRM', name:'Salesforce', digits:2, cls:'STOCK' }, { sym:'SNOW', name:'Snowflake', digits:2, cls:'STOCK' }, { sym:'ADBE', name:'Adobe', digits:2, cls:'STOCK' },
  { sym:'NAS100', name:'NASDAQ 100', digits:1, cls:'INDEX' }, { sym:'SPX500', name:'S&P 500', digits:1, cls:'INDEX' }, { sym:'US30', name:'Dow Jones 30', digits:1, cls:'INDEX' }, { sym:'GER40', name:'DAX 40', digits:1, cls:'INDEX' },
  { sym:'UK100', name:'FTSE 100', digits:1, cls:'INDEX' }, { sym:'JPN225', name:'Nikkei 225', digits:0, cls:'INDEX' }, { sym:'HK50', name:'Hang Seng', digits:1, cls:'INDEX' }, { sym:'AUS200', name:'ASX 200', digits:1, cls:'INDEX' },
  { sym:'EUSTX50', name:'Euro Stoxx 50', digits:1, cls:'INDEX' }, { sym:'WTI', name:'Crude Oil', digits:2, cls:'INDEX' },
];
var CORE_FX = CATALOG.slice(0,12).map(function(c){return c.sym;});            // 피드 로드 전에도 보이는 스켈레톤
var PAIRS = CATALOG.filter(function(c){ return c.cls==='FX'; });                // FX-class 조회용 (레거시 이름 유지)
var GROUPS = ['FX','Metals','Crypto','Stocks','Indices'];
function groupOf(c){ return c.cls==='FX' ? (/^XA[UG]/.test(c.sym)?'Metals':'FX') : c.cls==='CRYPTO'?'Crypto' : c.cls==='STOCK'?'Stocks' : 'Indices'; }
function catOf(sym){ return CATALOG.find(function(x){return x.sym===sym;}); }
// 보이는 상품 = 카탈로그 ∩ 피드. 핵심 FX 12는 항상. 나머지는 prices 에 mid 가 있어야 등장(거래 불가한데 가능처럼 보이면 안 됨).
function liveGroups(){ return GROUPS.filter(function(g){ return instruments(g).length>0; }); }
function instruments(group){ return CATALOG.filter(function(c){ if(group&&group!=='All'&&groupOf(c)!==group) return false; return CORE_FX.indexOf(c.sym)>=0 || midOf(c.sym)>0; }); }
var FX_FN_URL = 'https://grxnbgtfnaayeluenvqh.supabase.co/functions/v1/fx-prices';
var LEVERAGE_FX = 500;                           // fx_lev_cap FX (2026-09-08) — display only
var TF = [['1m','M1'],['5m','M5'],['30m','M30'],['1h','H1'],['4h',null],['1D','D1'],['1W',null],['ALL',null]];   // null = stage 2
// pip — MUST mirror fx_close.sql / fx-prices pip(): JPY 0.01, XAUUSD 0.01, XAGUSD 0.001, else 0.0001
function fxPip(sym){ return /JPY$/.test(sym)?0.01:sym==='XAUUSD'?0.01:sym==='XAGUSD'?0.001:0.0001; }
// ── asset class + contract: the FX account also carries STOCK/CRYPTO/INDEX positions opened in trading.html,
//    so every money view below must be class-aware or a 2-lot SPACEX shows as a 200,000-share position (2026-09-17 결함).
//    Truth = fx_specs (symbol, cls, contract) read at runtime (same as webtrade SERVER_CLS/SERVER_CONTRACT); the
//    fallbacks below mirror fx_contract() in fx_contract_size.sql + trading.html SYMBOLS and only apply when a row is missing.
var CCY=/^(USD|EUR|GBP|JPY|AUD|NZD|CAD|CHF|XAU|XAG)$/;
var SPREAD_BPS={CRYPTO:10,STOCK:8,INDEX:6};            // trading.html ALPEXA_SPREAD_BPS ↔ fx_close.sql (lockstep)
var LEV_CAP={FX:500,INDEX:20,STOCK:10,CRYPTO:10};       // fx_lev_cap (2026-09-08) — display only
function clsOf(sym){ var sp=S.specs[sym]; if(sp&&sp.cls) return sp.cls;
  var c=catOf(sym); if(c&&c.cls) return c.cls;
  if(/^[A-Z]{6}$/.test(sym)&&CCY.test(sym.slice(0,3))&&CCY.test(sym.slice(3))) return 'FX';
  return /USD$/.test(sym)?'CRYPTO':'STOCK'; }
function contractOf(sym){ var sp=S.specs[sym]; if(sp&&+sp.contract>0) return +sp.contract;
  if(sym==='XAUUSD') return 100; if(sym==='XAGUSD') return 5000; if(/^(DOGE|XRP|ADA)USD$/.test(sym)) return 10000;
  return clsOf(sym)==='FX'?100000:1; }
function levOf(sym){ return LEV_CAP[clsOf(sym)]||LEVERAGE_FX; }
// half-spread in price units — EXACT mirror of fx_close.sql v_half:
//   FX     : max(0.1, spr_pts+markup_pts)*pip/2            non-FX : mid*max(floorBps[cls], spr_pts)/10000/2
function halfOf(sym, mid){ var f=S.feed[sym]||{}; var spr=+f.spr||0, cls=clsOf(sym);
  if(cls==='FX'){ var mk=+(S.marks[sym]||0); return Math.max(0.1, spr+mk)*fxPip(sym)/2; }
  return mid*(Math.max(SPREAD_BPS[cls]||0, spr)/10000)/2; }
function midOf(sym){ var f=S.feed[sym]; return (f&&f.mid>0)?f.mid:0; }
function bidOf(sym){ var m=midOf(sym); return m?m-halfOf(sym,m):0; }
function askOf(sym){ var m=midOf(sym); return m?m+halfOf(sym,m):0; }
function closePx(sym, side){ var m=midOf(sym); return m?(side==='BUY'?m-halfOf(sym,m):m+halfOf(sym,m)):0; }   // fx_close v_close
function defLimit(sym){ var fx=clsOf(sym)==='FX'; return S.otype==='LIMIT' ? (fx?bidOf(sym)-8*fxPip(sym):bidOf(sym)*0.998) : (fx?askOf(sym)+8*fxPip(sym):askOf(sym)*1.002); }
function defSL(sym, ref){ if(!ref) return 0; return clsOf(sym)==='FX'?ref-80*fxPip(sym):+(ref*0.98).toFixed(digitsOf(sym)); }
function defTP(sym, ref){ if(!ref) return 0; return clsOf(sym)==='FX'?ref+52*fxPip(sym):+(ref*1.013).toFixed(digitsOf(sym)); }
function spreadPips(sym){ var m=midOf(sym); if(!m) return null; return (2*halfOf(sym,m))/fxPip(sym); }
function isFresh(sym){ var f=S.feed[sym]; return !!(f&&f.mid>0&&(Date.now()-(f.ts||0))<90000); }
// USD value of one unit of a currency, from the live feed (cross-pair conversion)
function ccyToUsd(code){ if(code==='USD') return 1; var p=midOf(code+'USD'); if(p) return p; var q=midOf('USD'+code); if(q) return 1/q; return null; }
function notionalUSD(sym, vol, price){ var c=contractOf(sym); if(clsOf(sym)!=='FX') return vol*c*price;   // fx_notional_usd: non-FX = size*lot*price
  var base=sym.slice(0,3), quote=sym.slice(3,6);
  if(quote==='USD') return vol*c*price; if(base==='USD') return vol*c; var r=ccyToUsd(base); return r?vol*c*r:vol*c*price; }
function pnlUSD(sym, open, close, side, vol){ var dist=(close-open)*(side==='BUY'?1:-1); var q=dist*contractOf(sym)*vol;
  if(clsOf(sym)!=='FX') return q;                                   // non-FX are USD-quoted (fx_close v_pnlq)
  var quote=sym.slice(3,6); if(quote==='USD') return q; var r=ccyToUsd(quote); return r?q*r:q; }
function marginUSD(sym, vol, price){ return notionalUSD(sym, vol, price)/levOf(sym); }
function pipValueUSD(sym, vol){ return pnlUSD(sym, 0, fxPip(sym), 'BUY', vol); }

/* ══ state (UI only — money is read from the server on every pull, never stored) ══ */
var LS = { get:function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
var S = {
  tab:'home', sym:'EURUSD', tf:'H1', otype:'MARKET', lots:0.10, sltp:false, sheet:null, sheetSeg:'FX', homeSeg: LS.get('rh.homeSeg','FX'), q:'', pamm:null,
  oneClick: LS.get('rh.oneClick','0')==='1', ack: LS.get('rh.oneClickAck','0')==='1', masked: LS.get('rh.mask','0')==='1',
  theme: LS.get('rh.theme','light'), actTab:'positions',
  feed:{}, marks:{}, specs:{}, cash:null, positions:[], pending:[], history:[], candles:{}, dayOpen:{}, scrub:null, toast:null, ready:false,
};
document.documentElement.setAttribute('data-theme', S.theme==='dark'?'dark':'light');
function me(){ try{ var m=JSON.parse(localStorage.getItem('alpexa.me')||'null'); return (m&&m.accts)?m:null; }catch(e){ return null; } }
function fxAcct(){ var m=me(); return m&&m.accts&&m.accts.fx?String(m.accts.fx):''; }
function db(){ return (window.AlpexaSync&&AlpexaSync.db)?AlpexaSync.db:null; }

/* ══ server reads (all read-only) ══ */
function applyFeedRows(rows){ var now=Date.now(); (rows||[]).forEach(function(p){ if(p&&p.symbol) S.feed[p.symbol]={mid:+p.mid||0, spr:+p.spr_pts||0, ts:now}; }); }
async function pullFeed(){ var d=db(); if(!d) return;
  try{ if(d.functions){ var x=await d.functions.invoke('feed',{body:{t:'prices'}}); if(x&&!x.error&&Array.isArray(x.data)){ applyFeedRows(x.data); return; } } }catch(e){}
  try{ var r=await d.from('prices').select('symbol,mid,spr_pts'); if(r&&r.data) applyFeedRows(r.data); }catch(e){} }
async function pullMarks(){ var d=db(); if(!d) return; try{ var r=await d.from('pricing_marks').select('symbol,markup_pts'); if(r&&r.data){ var m={}; r.data.forEach(function(p){ m[p.symbol]=Math.max(0,Math.min(50,+p.markup_pts||0)); }); S.marks=m; } }catch(e){} }
async function pullSpecs(){ var d=db(); if(!d) return; try{ var r=await d.from('fx_specs').select('symbol,cls,contract'); if(r&&r.data){ var m={}; r.data.forEach(function(x){ if(x&&x.symbol) m[x.symbol]={cls:String(x.cls||'').toUpperCase(), contract:+x.contract||0}; }); S.specs=m; } }catch(e){} }
// Managed funds (PAMM) — 투자자 리포트 RPC 는 **읽기 전용**(jsonb 스냅샷, 돈 이동 0). 이 파일의 유일한 rpc 호출. 참여/회수는 Stage 2.
async function pullPamm(){ var d=db(); if(!d||!me()){ S.pamm=[]; return; } try{ var r=await d.rpc('pamm_investor_report'); S.pamm=(r&&r.data&&r.data.ok&&Array.isArray(r.data.funds))?r.data.funds:[]; }catch(e){ S.pamm=[]; } render(); }
function pammMine(){ var t=0, has=false; (S.pamm||[]).forEach(function(f){ if(f.mine&&f.mine.value!=null){ t+=+f.mine.value; has=true; } }); return has?t:null; }
async function pullCash(){ var d=db(), a=fxAcct(); if(!d||!a) return; try{ var r=await d.from('accounts').select('balance').eq('acct_no',a).limit(1); if(r&&r.data&&r.data.length) S.cash=+r.data[0].balance||0; }catch(e){} }
async function pullPositions(){ var d=db(), a=fxAcct(); if(!d||!a) return;
  try{ var r=await d.from('positions').select('local_id,symbol,side,size,open_price,pnl,status,meta').eq('acct_no',a).eq('server','fx').eq('status','open');
    if(r&&r.data) S.positions=r.data.map(function(p){ var mt=p.meta||{}; return { id:String(p.local_id), sym:p.symbol, side:String(p.side||'').toUpperCase(), vol:+p.size||0, open:+p.open_price||0,
      sl:(mt.sl!=null&&+mt.sl>0)?+mt.sl:null, tp:(mt.tp!=null&&+mt.tp>0)?+mt.tp:null, swap:(mt.swap!=null&&isFinite(+mt.swap))?+mt.swap:null, srvPnl:+p.pnl||0 }; }); }catch(e){} }
async function pullPending(){ var d=db(), a=fxAcct(); if(!d||!a) return;
  try{ var r=await d.from('fx_pending').select('local_id,symbol,side,size,otype,trigger,sl,tp,status,created_at').eq('acct_no',a).eq('status','pending');
    if(r&&r.data) S.pending=r.data.map(function(p){ return { id:String(p.local_id), sym:p.symbol, side:String(p.side||'').toUpperCase(), vol:+p.size||0, otype:String(p.otype||'').toUpperCase(), trigger:+p.trigger||0, sl:+p.sl||0, tp:+p.tp||0, at:p.created_at||'' }; }); }catch(e){} }
async function pullHistory(){ var d=db(), m=me(); if(!d||!m||!m.custId) return;

    if(r&&r.data) S.history=r.data.map(function(s){ var mm=String(s.detail||'').match(/(BUY|SELL)\s+([\d.]+)\s+@\s+([\d.]+)\s*(?:→|->)\s*([\d.]+)/i);

function fmtMoney(v){ var s=Math.abs(v).toFixed(2); var parts=s.split('.'); return (v<0?'−':'')+'$'+(+parts[0]).toLocaleString('en-US')+'.'+parts[1]; }
function fmtSigned(v){ return (v>=0?'+':'−')+'$'+Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function digitsOf(sym){ var p=catOf(sym); if(p) return p.digits;
  var cls=clsOf(sym); if(cls==='FX') return /JPY$/.test(sym)?3:5; if(cls!=='CRYPTO') return 2;   // stocks/indices: cents
  var m=midOf(sym); return m>=1000?2:m>=1?4:6; }
function unitOf(sym){ return clsOf(sym)==='FX'?'pips':'pts'; }
function clsTag(sym){ var c=clsOf(sym); return c==='FX'?'':' <span class="ctag">'+(c==='STOCK'?'Stock':c==='CRYPTO'?'Crypto':'Index')+'</span>'; }
function fmtPx(v, sym, big){ if(!(v>0)) return '—'; var s=v.toFixed(digitsOf(sym)); if(!big) return s; return s.slice(0,-2)+'<big>'+s.slice(-2)+'</big>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function nameOf(sym){ var p=catOf(sym); return p?p.name:sym; }
// price step for steppers / default SL·TP distance: FX = 1 pip; others = 10 ticks (stocks $0.10 · BTC $1 · 1-digit index 1.0)
function tickOf(sym){ return clsOf(sym)==='FX'?fxPip(sym):Math.pow(10,-digitsOf(sym)); }
function stepOf(sym){ return clsOf(sym)==='FX'?fxPip(sym):tickOf(sym)*10; }
function spreadLabel(sym){ var m=midOf(sym); if(!m) return '—'; var c=clsOf(sym); if(c==='FX'&&!/^XA[UG]/.test(sym)) return spreadPips(sym).toFixed(1)+' pips'; return (2*halfOf(sym,m)).toFixed(digitsOf(sym))+' spread'; }
function distLabel(sym, from, to){ var d=to-from; if(clsOf(sym)==='FX') return (d>=0?'+':'−')+Math.abs(d/fxPip(sym)).toFixed(0)+' pips'; return (d>=0?'+':'−')+Math.abs(d).toFixed(digitsOf(sym)); }
function distUSD(sym, from, to, vol){ return Math.abs(pnlUSD(sym, from, to, 'BUY', vol)); }
function moneyBig(v){ var neg=v<0; var s=Math.abs(v).toFixed(2).split('.'); return '<span class="d">'+(neg?'−$':'$')+'</span><span class="n">'+(+s[0]).toLocaleString('en-US')+'</span><span class="c">.'+s[1]+'</span>'; }
function timeAgo(iso){ var t=Date.parse(iso||''); if(!isFinite(t)) return ''; var d=new Date(t); return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function dayLabel(iso){ var t=Date.parse(iso||''); if(!isFinite(t)) return 'Earlier'; var d=new Date(t), n=new Date(); var same=function(a,b){return a.toDateString()===b.toDateString();};
  if(same(d,n)) return 'Today'; var y=new Date(n.getTime()-86400000); if(same(d,y)) return 'Yesterday'; return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }

    return fmtPx(k==='lim'?(S.limitPx||defLimit(sym)):k==='sl'?(S.slPx||defSL(sym,ref)):(S.tpPx||defTP(sym,ref)), sym); }

  function stop(){ if(cur==null) return; clearTimeout(t); clearInterval(iv); t=iv=null; var was=fired; cur=null; fired=false;
    // the click that follows this release must NOT add one more step; render AFTER it has passed (same tick) so the
    // pressed element is still there for the browser to target — replacing the DOM first would eat unrelated clicks.
    if(was){ swallow=true; setTimeout(function(){ swallow=false; render(); },0); } }
  document.addEventListener('pointerdown', function(e){ var b=e.target.closest('.lots b[data-act]'); if(!b) return; cur=b.getAttribute('data-act'); n=0; fired=false;

  ['pointerup','pointercancel'].forEach(function(ev){ document.addEventListener(ev, stop); });
  document.addEventListener('click', function(e){ if(swallow&&e.target.closest('.lots b[data-act]')){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  window.__rhHold={ isHeld:function(){return fired||swallow;} };

// chart scrub (touch / mouse)
function scrubAt(x){ var ch=document.getElementById('chart'); var svg=ch&&ch.querySelector('svg'); if(!svg) return; var n=+svg.getAttribute('data-n')||0; var r=svg.getBoundingClientRect(); var i=Math.round((x-r.left)/r.width*(n-1)); S.scrub=Math.max(0,Math.min(n-1,i)); render(); }
document.addEventListener('pointerdown', function(e){ if(e.target.closest('#chart')) scrubAt(e.clientX); });
document.addEventListener('pointermove', function(e){ if(S.scrub!=null&&e.buttons&&e.target.closest('#chart')) scrubAt(e.clientX); });
document.addEventListener('pointerup', function(){ if(S.scrub!=null){ S.scrub=null; render(); } });
document.addEventListener('touchmove', function(e){ if(e.target.closest('#chart')&&e.touches[0]) scrubAt(e.touches[0].clientX); }, {passive:true});
document.addEventListener('touchend', function(){ if(S.scrub!=null){ S.scrub=null; render(); } });

/* ══ boot ══ */
(async function boot(){
  render();
  await Promise.all([pullSpecs(), pullMarks(), pullFeed(), pullCash(), pullPositions()]);
  S.ready=true; render();
  pullPending(); pullHistory();
  // Realtime: prices UPDATE merges straight into the feed (same shape as the poll)
  try{ var d=db(); if(d&&d.channel){ d.channel('rh-prices').on('postgres_changes',{event:'*',schema:'public',table:'prices'},function(m){ var row=m&&m.new; if(row&&row.symbol) S.feed[row.symbol]={mid:+row.mid||0,spr:+row.spr_pts||0,ts:Date.now()}; }).subscribe();
    var a=fxAcct(); if(a) d.channel('rh-pos-'+a).on('postgres_changes',{event:'*',schema:'public',table:'positions',filter:'acct_no=eq.'+a},function(){ pullPositions(); pullCash(); }).subscribe(); } }catch(e){}
  setInterval(function(){ if(!document.hidden) pullFeed(); },1500);
  setInterval(function(){ if(!document.hidden){ pullCash(); pullPositions(); } },10000);
  setInterval(function(){ if(!document.hidden) pullMarks(); },30000);
  setInterval(function(){ if(!document.hidden&&!S.sheet&&S.scrub==null) render(); },1000);   // re-paint quotes / floating once a second
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ pullFeed(); pullCash(); pullPositions(); } });
})();
window.__rh = S;   // for the headless test only (read-only introspection)
</script>
